name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # The root proxy integration test imports server/index.js, whose
      # runtime dependencies are intentionally owned by server/package.json.
      # Install them first so a clean runner matches the documented package
      # boundary instead of relying on a developer's existing server/node_modules.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install and test (repo root)
        run: |
          npm ci
          npm run build
          git diff --exit-code -- js
          npm test
          npm run test:social

      - name: Test server package
        working-directory: server
        run: npm test

  browser-acceptance:
    name: Browser acceptance
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Synthetic local browser acceptance
        run: npm run test:release:browser
        env:
          BEELO_ARTIFACT_DIR: ${{ github.workspace }}/.test-results/release
      - name: Synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-browser-acceptance-${{ github.sha }}
          path: .test-results/release/
          retention-days: 7
          if-no-files-found: warn
