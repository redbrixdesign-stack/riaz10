name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      # The root proxy integration test imports server/index.js, whose
      # runtime dependencies are intentionally owned by server/package.json.
      # Install them first so a clean runner matches the documented package
      # boundary instead of relying on a developer's existing server/node_modules.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install and test (repo root)
        run: |
          npm ci
          npm run build
          git diff --exit-code -- js
          npm test
          npm run test:social
          npm run test:performance:gate
          npm audit --audit-level=low

      - name: Audit server dependency lock
        working-directory: server
        run: npm audit --audit-level=low

      - name: Test server package
        working-directory: server
        run: npm test

  browser-acceptance:
    name: Browser acceptance
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Synthetic local browser acceptance
        run: npm run test:release:browser
        env:
          BEELO_ARTIFACT_DIR: ${{ github.workspace }}/.test-results/release
      - name: Synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: synthetic-browser-acceptance-${{ github.sha }}
          path: .test-results/release/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
