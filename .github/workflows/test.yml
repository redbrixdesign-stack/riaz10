name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm

      # The root proxy integration test imports server/index.js, whose
      # runtime dependencies are intentionally owned by server/package.json.
      # Install them first so a clean runner matches the documented package
      # boundary instead of relying on a developer's existing server/node_modules.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install and test (repo root)
        run: |
          npm ci
          npm run build
          git diff --exit-code -- js
          npm test
          npm run test:social
          npm run test:performance:gate
          npm audit --audit-level=low

      - name: Audit server dependency lock
        working-directory: server
        run: npm audit --audit-level=low

      - name: Test server package
        working-directory: server
        run: npm test

  browser-acceptance:
    name: Browser acceptance
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Official browser/system-dependency bundle, matched to package-lock.json.
    # Avoid per-run apt downloads from the mirror that timed out in C14.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify preinstalled browser runtime
        run: |
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"),{chromium,webkit}=require("playwright");assert.equal(require("playwright/package.json").version,"1.62.1","Update the pinned CI image when changing Playwright");for(const engine of [chromium,webkit]){fs.accessSync(engine.executablePath());console.log(engine.name()+" executable present");}'
      - name: Synthetic local browser acceptance
        run: npm run test:release:browser
        env:
          BEELO_ARTIFACT_DIR: ${{ github.workspace }}/.test-results/release
      - name: Synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: synthetic-browser-acceptance-${{ github.sha }}
          path: .test-results/release/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
