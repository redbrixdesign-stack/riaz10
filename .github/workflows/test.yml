name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install and test (repo root)
        run: |
          npm ci
          npm test

      - name: Install and test (server/)
        working-directory: server
        run: |
          npm ci
          npm test