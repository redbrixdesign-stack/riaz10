<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Core palette */
    --bg: #050505;
    --surface: #0B0B0B;
    --card: #0F0F0F;
    --surface-raised: #141414;
    --surface-hover: #1A1A1A;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    
    /* Typography */
    --text-primary: #F2F2F0; /* soft off-white — 18.2:1 on canvas */
    --text-secondary: #A1A1A1; /* 7.9:1 on canvas — WCAG AA/AAA */
    --text-muted: #808080; /* 5.2:1 on canvas — raised from #6F6F6F (4.1:1, AA fail) */
    --text-disabled: #6B6B6B; /* 3.7:1 — de-emphasised/disabled tier, keeps hierarchy */
    
    /* Accents */
    --accent: #F2C94C; /* restrained warm yellow */
    --accent-border: rgba(242, 201, 76, 0.25);
    
    /* Functional */
    --state-danger: #EF4444;
    --radius-card: 14px;
    --radius-pill: 100px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  body{
    background:#000;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;justify-content:center;padding:20px 12px 0;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    color:var(--text-primary);
  }

  .app-container{
    width:100%;max-width:390px;background:var(--bg);
    border-radius:40px;overflow:hidden;
    height:844px;position:relative;display:flex;flex-direction:column;
    box-shadow:0 30px 60px -10px rgba(0,0,0,0.9);
    border:1px solid var(--border);
  }

  /* Status Bar */
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 24px 8px;font-size:13px;font-weight:500;color:var(--text-primary);
    flex-shrink:0;letter-spacing:-0.01em;
  }
  .statusbar .icons{display:flex;gap:5px;align-items:center;opacity:0.85;font-size:11px;}

  /* Scrollable content */
  .scroll-content{
    flex:1;overflow-y:auto;
    padding:0 20px 92px;
  }
  .scroll-content::-webkit-scrollbar{display:none;}

  /* --- Flex Utilities --- */
  .flex{display:flex;}.justify-between{justify-content:space-between;}.items-center{align-items:center;}.gap-2{gap:8px;}

  /* --- Typography Base --- */
  .section-meta{font-size:12px;color:var(--text-muted);font-weight:400;letter-spacing:-0.01em;}

  /* --- Header --- */
  .header{
    display:flex;align-items:center;gap:12px;padding:4px 0 16px;
    justify-content:space-between;
  }
  .header-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .logo-circle{font-size:24px;font-weight:600;color:var(--text-primary);letter-spacing:-0.02em;flex-shrink:0;}
  .accent-dot{color:var(--accent);}
  .logo-owner{font-size:13px;font-weight:500;color:var(--text-muted);padding-left:12px;border-left:1px solid var(--border);line-height:1;flex-shrink:0;}
  .header-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .target-sub-header{font-size:12px;font-weight:400;color:var(--text-secondary);line-height:1;}
  .burger-btn{background:transparent;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:4px;transition:color 0.15s;line-height:1;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;}
  .burger-btn:hover{color:var(--text-secondary);}

  /* --- 1. Weekly Calendar --- */
  .calendar-section{margin-bottom:18px;}
  .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .calendar-title{font-size:14px;font-weight:500;color:var(--text-primary);}
  .calendar-controls{display:flex;gap:4px;}
  .arrow-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.15s;font-family:inherit;line-height:1;}
  .arrow-btn:hover{background:var(--surface-raised);color:var(--text-primary);border-color:var(--border-strong);}
  .arrow-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .calendar-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .calendar-strip::-webkit-scrollbar{display:none;}
  .day-item{
    appearance:none;background:transparent;border:none;cursor:pointer;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    flex:1;min-width:42px;padding:8px 4px 6px;border-radius:8px;transition:all 0.15s;position:relative;color:var(--text-primary);font-family:inherit;min-height:60px;
  }
  .day-item:hover{background:var(--surface-raised);}
  .day-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  
  .day-item .day-label{font-size:10px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.02em;}
  .day-item .day-number{font-size:16px;font-weight:500;color:var(--text-disabled);transition:color 0.15s;}
  .day-item .day-count{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;color:var(--text-disabled);background:var(--surface);margin-top:2px;min-width:14px;text-align:center;transition:all 0.15s;}

  /* Day States */
  .day-item.active{background:var(--surface-hover);}
  .day-item.active .day-number{color:var(--text-primary);}
  .day-item.active .day-count{color:var(--accent);background:rgba(242, 201, 76, 0.12);}
  .day-item.active::after{content:'';position:absolute;bottom:-2px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:2px;}

  .day-item.has-visits .day-number{color:var(--text-secondary);}
  .day-item.has-visits .day-count{background:var(--surface-raised);color:var(--text-muted);}
  .day-item.has-visits.active .day-count{color:var(--accent);}
  /* Subtle weekend tint — visual only, no contrast impact on text */
  .day-item.weekend{background:color-mix(in srgb, var(--surface) 45%, transparent);}
  /* Past days recede — via colour, not heavy opacity (opacity multiplies
     into the background and destroys contrast; 0.45 made day numbers
     ~1.6:1). Recolour to the muted/disabled tiers and only ease opacity
     slightly so past days stay readable (numbers ≈ 4.4:1). */
  .day-item.past{opacity:0.85;}
  .day-item.past .day-number{color:var(--text-muted);}
  .day-item.past .day-count{color:var(--text-muted);}

  /* --- 2. Appointment Schedule Block --- */
  .section-block{background:var(--card);border-radius:var(--radius-card);padding:16px 14px;border:1px solid var(--border);margin-bottom:18px;}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .section-title{font-size:13px;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;}
  .badge-count{background:var(--surface-raised);color:var(--text-primary);font-size:10px;font-weight:600;padding:1px 8px;border-radius:var(--radius-pill);border:1px solid var(--border);}

  .day-summary-title{font-size:14px;font-weight:500;color:var(--text-primary);letter-spacing:-0.01em;display:flex;align-items:center;gap:4px;}
  .day-summary-date{font-size:12px;color:var(--text-muted);font-weight:400;}

  /* Appointment feed */
  .appointment-feed{transition: opacity 0.18s ease, transform 0.18s ease;}
  .appointment-feed.updating{opacity: 0.6;transform: translateY(2px);}
  .feed-empty{text-align:center;padding:20px 0 12px;color:var(--text-muted);font-size:13px;}
  .feed-empty .hint{color:var(--text-disabled);font-size:11px;margin-top:4px;}

  /* Standard Horizontal Row (Buttons removed) */
  .appointment{display:flex;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--border);}
  .appointment:last-child{border-bottom:none;padding-bottom:0;}
  .appointment--next{background:transparent;margin:0;padding:14px 4px;}
  
  .appointment__time{
    font-size:13px;font-weight:500;color:var(--text-secondary);
    width:48px;flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:2px;
    display:flex;align-items:center;gap:6px;
  }
  /* Active dot for next appointment */
  .appointment--next .appointment__time::before{
    content:'';display:inline-block;width:6px;height:6px;
    background:var(--accent);border-radius:50%;flex-shrink:0;
  }

  .appointment__details{flex:1;padding:0 8px;display:flex;flex-direction:column;}
  
  .appt-name-row{display:flex;justify-content:space-between;align-items:flex-start;width:100%;margin-bottom:2px;flex-wrap:wrap;}
  .appointment__customer{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;}
  .appointment__meta-right{flex-shrink:0;margin-left:12px;font-size:12px;color:var(--text-secondary);margin-top:2px;}
  
  .appointment__type{font-size:12px;color:var(--text-secondary);margin:0 0 2px 0;font-weight:400;}
  .appointment__location{font-size:12px;color:var(--text-secondary);margin:0;overflow-wrap:anywhere;}

  /* Touch targets: all interactive controls honour a 44px minimum */
  .button{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:var(--radius-pill);font-family:inherit;font-size:12px;font-weight:500;min-height:44px;padding:0 16px;
    cursor:pointer;transition:all 0.15s;background:transparent;outline:none;
  }
  .button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .button:active{transform:scale(0.97);}
  /* Primary: the most important action — subtle golden border + hover */
  .button--primary{background:var(--surface-raised);border:1px solid var(--accent-border);color:var(--text-primary);}
  .button--primary:hover{background:var(--surface-hover);border-color:var(--accent);}
  /* Secondary: thinner border, less visual weight */
  .button--secondary{border:1px solid var(--border);color:var(--text-secondary);}
  .button--secondary:hover{background:var(--surface-raised);color:var(--text-primary);border-color:var(--border-strong);}

  /* --- FEATURED VERTICAL APPOINTMENT CARD (Mrs Smith) --- */
  .appointment--featured {
    background: var(--surface-raised);
    border-radius: var(--radius-card);
    padding: 16px;
    margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid var(--border);
  }
  /* Line 1 — time, with the restrained gold "next" dot (same pattern as the
     horizontal next-row) */
  .appointment--featured .appt-top-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 6px; letter-spacing: -0.01em;
  }
  .appointment--featured .appt-top-row::before {
    content: ''; display: inline-block; width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%; margin-right: 6px;
  }
  /* Line 2 — customer */
  .appointment--featured .appt-name-row {
    display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
  }
  .appointment--featured .appt-name {
    font-size: 18px; font-weight: 600; color: var(--text-primary);
    line-height: 1.2;
  }
  /* Line 3 — visit context (rendered only when the data exists) */
  .appointment--featured .appt-context {
    font-size: 12px; color: var(--text-secondary); font-weight: 400;
  }
  /* Line 4 — address */
  .appointment--featured .appt-location {
    font-size: 13px; color: var(--text-secondary); margin-top: 2px;
  }
  /* Line 5 — journey / access meta (rendered only when data exists) */
  .appointment--featured .appt-journey {
    font-size: 12px; color: var(--text-secondary); margin-top: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .appointment--featured .appt-actions {
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
    margin-top: 14px;
  }
  .appointment--featured .appt-actions .button {
    flex: 0 0 auto; min-width: 132px; min-height: 44px; font-size: 12px;
  }
  /* Expandable "More about this visit" — native details/summary */
  .appt-more { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 8px; }
  .appt-more summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    min-height: 44px; transition: color 0.15s;
  }
  .appt-more summary::-webkit-details-marker { display: none; }
  .appt-more summary::after { content: '›'; font-size: 16px; transition: transform 0.15s; }
  .appt-more[open] summary::after { transform: rotate(90deg); }
  .appt-more summary:hover, .appt-more[open] summary { color: var(--text-primary); }
  .appt-more-row {
    display: flex; gap: 10px; padding: 7px 0 7px 2px;
    font-size: 12px; align-items: baseline;
  }
  .appt-more-row + .appt-more-row { border-top: 1px solid var(--border); }
  .appt-more-row .row-label {
    flex: 0 0 auto; width: 84px; font-weight: 500; color: var(--text-muted);
  }
  .appt-more-row .row-value { color: var(--text-primary); line-height: 1.4; }
  /* Empty data rows are hidden — never fabricate fields that don't exist */
  .appt-more-row--empty { display: none; }

  /* --- 4. Attention Block (No icons) — rows are real <button>s --- */
  .attn-row{display:flex;align-items:center;gap:4px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:all 0.15s;border-radius:6px;min-height:44px;appearance:none;background:transparent;border-top:none;border-left:none;border-right:none;width:100%;text-align:left;font:inherit;color:inherit;}
  .attn-row:last-of-type{border-bottom:none;padding-bottom:0;}
  .attn-row:hover{background:var(--surface-raised);}
  .attn-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .attn-text{flex:1;min-width:0;}
  .attn-text .t{display:block;font-size:13px;font-weight:500;color:var(--text-primary);letter-spacing:-0.01em;line-height:1.3;}
  .attn-text .s{display:block;font-size:11px;font-weight:400;margin-top:2px;color:var(--text-secondary);}
  .attn-text .s.due{color:var(--accent);font-weight:500;}
  .attn-text .s.overdue{color:var(--state-danger);font-weight:500;}
  .attn-text .s.action{color:var(--text-muted);background:var(--surface-raised);padding:1px 8px;border-radius:var(--radius-pill);display:inline-block;border:1px solid var(--border);}
  .chev{color:var(--text-muted);font-size:12px;flex-shrink:0;}

  /* --- 5. Ask Beelo --- */
  .assist-block{background:var(--card);border-radius:var(--radius-card);padding:16px 14px;border:1px solid var(--border);}
  .ask-input-wrap{display:flex;align-items:center;gap:8px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 6px 6px 14px;min-height:44px;transition:border-color 0.15s;}
  .ask-input-wrap:focus-within{border-color:var(--border-strong);}
  .ask-input-wrap input{flex:1;border:none;background:none;outline:none;font-size:13px;color:var(--text-primary);font-family:inherit;font-weight:400;min-width:0;}
  .ask-input-wrap input::placeholder{color:var(--text-secondary);}
  .submit-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;border-radius:50%;width:44px;height:44px;flex-shrink:0;}
  .submit-btn:hover{color:var(--text-primary);background:var(--surface-hover);}
  
  .ask-subtitle{font-size:12px;font-weight:400;color:var(--text-secondary);margin:10px 0 2px 2px;}
  .chips-row{display:flex;flex-wrap:nowrap;gap:6px;margin-top:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .chips-row::-webkit-scrollbar{display:none;}
  .chip{font-size:11px;font-weight:400;color:var(--text-secondary);background:var(--surface-raised);border:1px solid var(--border);padding:0 12px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;transition:all 0.15s;display:inline-flex;align-items:center;min-height:44px;appearance:none;font-family:inherit;}
  .chip:hover{border-color:var(--border-strong);color:var(--text-primary);background:var(--surface-hover);}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .quick-action-strip{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .qa-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-pill);padding:0 12px;min-height:44px;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all 0.15s;}
  .qa-btn:hover{background:var(--surface-raised);border-color:var(--border-strong);color:var(--text-primary);}
  .qa-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .qa-btn .ic{font-size:13px;}

  /* --- 6. Bottom Navigation --- */
  .bottom-nav{
    position:absolute;bottom:0;left:0;right:0;
    height:72px;background:var(--bg); 
    display:flex;justify-content:space-around;align-items:flex-start; 
    padding:12px 16px 0; border-top:1px solid var(--border);
  }
  .nav-item{
    appearance:none;background:transparent;border:none;cursor:pointer;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:48px;height:48px;border-radius:14px;color:var(--text-muted);font-family:inherit;transition:all 0.15s;
  }
  .nav-item:hover{color:var(--text-secondary);}
  .nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .nav-item.active{background:var(--surface);color:var(--text-primary);}
  .nav-label{font-size:9px;font-weight:500;color:var(--text-disabled);letter-spacing:0.02em;text-transform:uppercase;transition:color 0.15s;}
  .nav-item.active .nav-label{color:var(--text-secondary);}

  @media (max-width: 360px) {
    .appointment--featured .appt-name { font-size: 16px; }
    .nav-label { font-size: 8px; }
  }

  /* Narrow phones (~320px): keep breathing room, let actions wrap */
  @media (max-width: 340px) {
    .scroll-content { padding: 0 14px 92px; }
    .appointment--featured { padding: 14px; }
    .appointment--featured .appt-actions .button { min-width: 100%; }
  }

  @media (min-width: 600px) {
    body{padding:40px 24px;}
    .app-container{max-width:450px;height:900px;border-radius:48px;}
  }
</style>
</head>
<body>

<div class="app-container" id="app">
  <div class="statusbar">
    <span>9:15</span>
    <div class="icons">
      <span>📶</span><span>📡</span><span>🔋</span>
    </div>
  </div>

  <div class="scroll-content">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo-circle">Beelo<span class="accent-dot">.</span></div>
        <span class="logo-owner">Riaz</span>
      </div>
      <div class="header-right">
        <span class="target-sub-header">£1,160 to target</span>
        <button class="burger-btn" type="button" data-action="menu" aria-label="Menu" aria-expanded="false" aria-controls="main-menu">☰</button>
      </div>
    </div>

    <!-- 1. Weekly Calendar -->
    <div class="calendar-section">
      <div class="calendar-header">
        <span class="calendar-title" id="weekTitle">This week</span>
        <div class="calendar-controls">
          <button class="arrow-btn" type="button" data-action="shiftWeek" data-direction="-1" aria-label="Previous week">‹</button>
          <button class="arrow-btn" type="button" data-action="shiftWeek" data-direction="1" aria-label="Next week">›</button>
        </div>
      </div>
      <div class="calendar-strip" id="calendarStrip" aria-live="polite" aria-atomic="true"></div>
    </div>

    <!-- 2. Appointment Schedule Block -->
    <div class="section-block">
      <div class="section-header">
        <div class="flex items-center gap-2">
          <span class="day-summary-title" id="daySummaryTitle">Today</span>
          <span class="day-summary-date" id="daySummaryDate">Friday, 16 August</span>
        </div>
        <span class="section-meta" id="daySummaryCount">4 visits</span>
      </div>
      
      <!-- 3. Appointment Feed -->
      <div class="appointment-feed" id="appointmentFeed" aria-live="polite" aria-atomic="true">
        <!-- JS renders appointments here -->
      </div>
    </div>

    <!-- 4. Needs Your Attention (No icons) -->
    <div class="section-block">
      <div class="section-header">
        <span class="section-title">Needs your attention</span>
        <span class="badge-count">4</span>
      </div>
      <button type="button" class="attn-row" data-action="attention" data-kind="quote">
        <span class="attn-text"><span class="t">Quote for Sarah — follow-up due today</span><span class="s due">Due today</span></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <button type="button" class="attn-row" data-action="attention" data-kind="payment">
        <span class="attn-text"><span class="t">Payment from Mr Ahmed — £420 outstanding</span><span class="s overdue">Overdue</span></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <button type="button" class="attn-row" data-action="attention" data-kind="reminder">
        <span class="attn-text"><span class="t">Tomorrow's first customer hasn't received their reminder</span><span class="s action">Send reminder</span></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </div>

    <!-- 5. Ask Beelo -->
    <div class="assist-block">
      <div class="section-header"><span class="section-title">ASK BEELO</span></div>
      <div class="ask-input-wrap">
        <input type="text" placeholder="Ask Beelo about your day…">
        <button class="submit-btn" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        </button>
      </div>
      <div class="ask-subtitle">Ask me anything</div>
      <div class="chips-row">
        <button type="button" class="chip" data-action="ask" data-command="next">What's next?</button>
        <button type="button" class="chip" data-action="ask" data-command="chase">Who should I chase?</button>
      </div>
      <div class="quick-action-strip">
        <button type="button" class="qa-btn" data-action="add-visit"><span class="ic" aria-hidden="true">+</span> Add visit</button>
        <button type="button" class="qa-btn" data-action="scan"><span class="ic" aria-hidden="true">📄</span> Scan document</button>
      </div>
    </div>
  </div>

  <!-- 6. Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" type="button" data-action="tab" aria-current="page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" type="button" data-action="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      <span class="nav-label">Scan</span>
    </button>
    <button class="nav-item" type="button" data-action="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
      <span class="nav-label">Tools</span>
    </button>
  </nav>
</div>

<script>
  // --- MOCK DATA — 6 appointments across the week: single-visit days
  // (Mon, Tue, Sun), an empty day (Wed/Thu/Sat) and a 3-visit day (Fri,
  // "today", with the featured NEXT card).
  const MOCK_TODAY = '2026-08-16';
  const SEED_MONDAY = '2026-08-12';

  const SEED_WEEK = [
    { id: '2026-08-12', data: [{time:'09:00', customer:'@Mr James.', type:'General Maintenance', loc:'Altrincham', meta:'15 min away', isNext:false}] },
    { id: '2026-08-13', data: [{time:'14:30', customer:'@Mrs Davis.', type:'Follow-up', loc:'Sale', meta:'10 min away', isNext:false}] },
    { id: '2026-08-14', data: [] },
    { id: '2026-08-15', data: [] },
    { id: '2026-08-16', data: [
      {time:'09:30', customer:'@Mrs Smith', loc:'14 Beechwood Avenue, Sale M33 FAQ', meta:'18 min via A5029', parking:'Parking available', note:'Customer considering timber-look frames', isNext:true, featured:true},
      {time:'11:15', customer:'@Mr Khan.', type:'Follow-up visit', loc:'Altrincham', meta:'25 min away', isNext:false},
      {time:'14:30', customer:'@Mrs Jones.', type:'Initial consultation', loc:'Wilmslow', meta:'', isNext:false}
    ] },
    { id: '2026-08-17', data: [] },
    { id: '2026-08-18', data: [{time:'10:30', customer:'@Mr Patel.', type:'Review meeting', loc:'Stockport', meta:'', isNext:false}] }
  ];

  // date -> visits lookup, built from the seeded demo week
  const VISITS_BY_DATE = {};
  SEED_WEEK.forEach(day => { VISITS_BY_DATE[day.id] = day.data; });

  let currentActiveId = MOCK_TODAY;

  // --- UTC-safe date helpers (no local-timezone off-by-one) ---
  const parseISO = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const toISO = d => d.toISOString().slice(0, 10);
  const addDaysUTC = (d, days) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + days));

  // Monday-first week containing the anchor date, aligned to the seeded
  // week's fictional Mon-Sun scheme (the demo treats 12 Aug as Monday).
  function weekOf(anchorIso) {
    const anchor = parseISO(anchorIso);
    const monday = parseISO(SEED_MONDAY);
    const dayDiff = Math.round((anchor - monday) / 86400000);
    const weekStart = addDaysUTC(monday, Math.floor(dayDiff / 7) * 7);
    const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    return Array.from({ length: 7 }, (_, i) => {
      const d = addDaysUTC(weekStart, i);
      const id = toISO(d);
      return { id, label: WEEKDAYS[i], num: d.getUTCDate(), data: VISITS_BY_DATE[id] || [] };
    });
  }

  // "More about this visit" rows are rendered ONLY for fields that exist in
  // the data and aren't already shown on the card (parking lives on line 5,
  // so only a separate parking-*instructions* field would repeat it here).
  // Rows for absent fields (access code, floor, …) are never created — and
  // the .appt-more-row--empty rule would hide them anyway.
  function createAppointmentHTML(item) {
    // Specialized Featured Card for the first appointment
    if (item.featured) {
      const journey = [item.meta, item.parking].filter(Boolean).join(' · ');
      const moreRows = [
        { label: 'Access code', value: item.accessCode },
        { label: 'Floor', value: item.floor },
        { label: 'Notes', value: item.note }
      ].filter(r => r.value).map(r => `
        <div class="appt-more-row">
          <span class="row-label">${r.label}</span>
          <span class="row-value">${r.value}</span>
        </div>`).join('');

      return `
        <div class="appointment--featured">
          <div class="appt-top-row">
            <span>${item.time}</span>
          </div>
          <div class="appt-name-row">
            <span class="appt-name">${item.customer}</span>
          </div>
          ${item.type ? `<div class="appt-context">${item.type}</div>` : '<div class="appt-context">Visit</div>'}
          <div class="appt-location">${item.loc}</div>
          ${journey ? `<div class="appt-journey">${journey}</div>` : ''}

          <div class="appt-actions">
            <button type="button" class="button button--primary" data-action="navigate" data-customer="${item.customer}">➤ Navigate</button>
            <button type="button" class="button button--secondary" data-action="call" data-customer="${item.customer}">📞 Call</button>
          </div>

          ${moreRows ? `
          <details class="appt-more">
            <summary>More about this visit</summary>
            ${moreRows}
          </details>` : ''}
        </div>
      `;
    }

    // Standard Horizontal Row for all other appointments (No action buttons)
    return `
      <article class="appointment ${item.isNext ? 'appointment--next' : ''}">
        <div class="appointment__time">${item.time}</div>
        <div class="appointment__details">
          <div class="appt-name-row">
            <h3 class="appointment__customer">${item.customer}</h3>
            ${item.meta ? `<span class="appointment__meta-right">${item.meta}</span>` : ''}
          </div>
          ${item.type ? `<p class="appointment__type">${item.type}</p>` : ''}
          ${item.loc ? `<p class="appointment__location">${item.loc}</p>` : ''}
        </div>
      </article>
    `;
  }

  function renderCalendar(activeId) {
    const strip = document.getElementById('calendarStrip');
    const weekDays = weekOf(activeId);
    // Week indicator, e.g. "This week · 12–18 Aug" (or 5–11 Aug when
    // shifted); a week crossing a month boundary shows "30 Aug–5 Sep".
    const weekTitle = document.getElementById('weekTitle');
    if (weekTitle) {
      const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
      const start = parseISO(weekDays[0].id);
      const end = parseISO(weekDays[6].id);
      const startStr = fmt(start);
      const endStr = fmt(end);
      const label = start.getUTCMonth() === end.getUTCMonth()
        ? `${start.getUTCDate()}–${endStr}`
        : `${startStr}–${endStr}`;
      weekTitle.textContent = `This week · ${label}`;
    }
    strip.innerHTML = weekDays.map((day, i) => {
      const isActive = day.id === activeId;
      const isPast = day.id < activeId;
      const count = day.data.length;
      const hasVisits = count > 0;
      const isWeekend = i >= 5; // Sat/Sun — visual tint only
      const countDisplay = count > 0 ? count : '—';
      const visitText = count === 0 ? 'no visits' : (count === 1 ? '1 visit' : count + ' visits');
      const stateText = isActive ? ', selected' : isPast ? ', past' : '';
      const ariaLabel = `${day.label} ${day.num}, ${visitText}${stateText}`;
      return `
        <button class="day-item ${isActive ? 'active' : ''} ${isPast ? 'past' : ''} ${hasVisits ? 'has-visits' : ''} ${isWeekend ? 'weekend' : ''}" type="button" data-action="day" data-date="${day.id}" aria-label="${ariaLabel}" aria-selected="${isActive}" ${isActive ? 'aria-current="date"' : ''}>
          <span class="day-label">${day.label}</span>
          <span class="day-number">${day.num}</span>
          <span class="day-count" aria-hidden="true">${countDisplay}</span>
        </button>
      `;
    }).join('');
  }

  function renderFeed(activeId) {
    const visits = VISITS_BY_DATE[activeId] || [];
    const feed = document.getElementById('appointmentFeed');
    const summaryTitle = document.getElementById('daySummaryTitle');
    const summaryDate = document.getElementById('daySummaryDate');
    const summaryCount = document.getElementById('daySummaryCount');

    if (visits.length === 0) {
      summaryTitle.innerText = 'No visits';
      summaryDate.innerText = '';
      summaryCount.innerText = '0 visits';
      feed.innerHTML = `
        <div class="feed-empty">
          <p>No appointments scheduled for this day.</p>
          <p class="hint">Use 'Add visit' to schedule a new appointment.</p>
          <button type="button" class="button button--primary" data-action="add-visit">+ Add visit</button>
        </div>
      `;
      return;
    }

    const dateStr = parseISO(activeId).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });

    if (activeId === MOCK_TODAY) summaryTitle.innerText = 'Today';
    else if (activeId < MOCK_TODAY) summaryTitle.innerText = 'Completed';
    else summaryTitle.innerText = 'Scheduled';

    summaryDate.innerText = dateStr;
    summaryCount.innerText = `${visits.length} visit${visits.length > 1 ? 's' : ''}`;

    feed.innerHTML = visits.map(item => createAppointmentHTML(item)).join('');
  }

  function selectDay(dayId) {
    transitionTo(dayId);
  }

  // Shifts the focused date by a whole week (previous/next week), keeping
  // the same weekday — the calendar genuinely moves backward/forward now.
  function shiftWeek(direction) {
    transitionTo(toISO(addDaysUTC(parseISO(currentActiveId), 7 * direction)));
  }

  function transitionTo(dayId) {
    currentActiveId = dayId;
    renderCalendar(currentActiveId);
    const feed = document.getElementById('appointmentFeed');
    feed.classList.add('updating');
    setTimeout(() => {
      renderFeed(currentActiveId);
      feed.classList.remove('updating');
    }, 180);
  }

  // --- Action routing: single delegated listener replaces all inline
  // onclick handlers (CSP-friendly, one place to maintain). Every
  // interactive element carries a data-action attribute; behaviour is
  // preserved exactly (the mock's alerts included).
  function handleAction(action, el) {
    switch (action) {
      case 'shiftWeek':
        shiftWeek(Number(el.dataset.direction));
        break;
      case 'day':
        selectDay(el.dataset.date);
        break;
      case 'menu': {
        const open = el.getAttribute('aria-expanded') === 'true';
        el.setAttribute('aria-expanded', String(!open));
        break;
      }
      case 'tab': {
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.classList.remove('active');
          btn.removeAttribute('aria-current');
        });
        el.classList.add('active');
        el.setAttribute('aria-current', 'page');
        break;
      }
      case 'navigate':
        alert('Navigating to ' + el.dataset.customer + '...');
        break;
      case 'call':
        alert('Calling ' + el.dataset.customer + '...');
        break;
      case 'add-visit':
        alert('Add new visit');
        break;
      case 'scan':
        alert('Scanning document...');
        break;
      case 'ask': {
        // Suggestion chip: put the suggestion in the input so the control is
        // honest and actionable (was a dead span before).
        const input = document.querySelector('.ask-input-wrap input');
        if (input) { input.value = el.textContent.trim(); input.focus(); }
        break;
      }
      case 'attention':
        // Preserved behaviour: the rows were non-interactive divs; they are
        // now real buttons that announce themselves but have no action yet.
        break;
    }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el) handleAction(el.dataset.action, el);
  });

  // Keep <details>/<summary> aria-expanded in sync with native open state.
  document.addEventListener('toggle', e => {
    if (e.target && e.target.matches && e.target.matches('.appt-more')) {
      const summary = e.target.querySelector('summary');
      if (summary) summary.setAttribute('aria-expanded', e.target.open ? 'true' : 'false');
    }
  }, true);

  document.addEventListener('DOMContentLoaded', () => {
    selectDay(currentActiveId);
  });
</script>
</body>
</html>
