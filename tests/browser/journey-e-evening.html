<div id="main"></div>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  // Test-mode encryption key (see app.js promptPassphrase test branch)
  await initEncryption("test-passphrase-123");
  await DB.deleteAllData();

  Object.assign(CONFIG, {
    weeklyTarget: 600,
    autoMessages: { enabled: true, eveningHour: 18, morningHour: 8 },
    templates: { evening_before: 'Hi {firstName}, see you tomorrow at {time}.' }
  });

  const customer = await DB.addCustomer({ firstName: 'John', lastName: 'Smith', fullName: 'John Smith', phone: '07123456789' });
  const today = Utils.getToday();
  const at = (d, h, m = 0) => { const dt = new Date(d); dt.setHours(h, m, 0, 0); return dt.toISOString(); };

  // Today's measure is done; tomorrow's consultation still needs its
  // day-before message; a quote from last week is due; an order is unpaid.
  const doneToday = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'measure',
    date: at(today, 14), status: 'completed', outcome: 'measured'
  });
  const tomorrowVisit = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(Utils.addDays(today, 1), 10)
  });
  await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(Utils.addDays(today, -6), 11), status: 'completed', outcome: 'quoted', value: 1250
  });
  const unpaid = await DB.addOrder({ customerId: customer.id, total: 900 });

  // 1. Day-before scheduling for tomorrow's visit.
  await MessageScheduler.reschedule();
  const key = (stage, id) => 'advisoros_auto_' + stage + '_' + id;
  step('evening-before scheduled for tomorrow visit', MessageScheduler.timers.has(key('evening_before', tomorrowVisit.id)));
  step('morning-of scheduled for tomorrow visit', MessageScheduler.timers.has(key('morning_of', tomorrowVisit.id)));
  step('no check-in scheduled for the completed visit',
    !MessageScheduler.timers.has(key('evening_before', doneToday.id)) && !MessageScheduler.timers.has(key('morning_of', doneToday.id)));

  // 2. Evening review: nothing to log, one message due, one order unpaid,
  //    one quote follow-up due.
  const review = await CompanionFeature.answerEveningReview();
  const fact = l => (review.facts.find(f => f.label === l) || {}).value;
  step('no outcomes outstanding', fact('Outcomes not logged') === undefined, { got: fact('Outcomes not logged') });
  step('day-before message flagged for tomorrow', fact('Messages unsent') === '1 visit need a message', { got: fact('Messages unsent') });
  step('unpaid order reported', fact('Outstanding') === Utils.formatCurrency(900) + ' over 1 order', { got: fact('Outstanding') });
  step('quote follow-up + day-before task both due', fact('Follow-ups due') === '2 tasks', { got: fact('Follow-ups due') });

  // 3. Task inbox: tomorrow's message task, payment task, quote task.
  const tasks = await FollowupsFeature.loadTasks();
  const tmrw = tasks.find(t => t.kind === 'visit_tomorrow' && t.appointment && t.appointment.id === tomorrowVisit.id);
  step('tomorrow visit has a day-before task', !!tmrw && tmrw.due === true, { got: tmrw && tmrw.action });
  const payment = tasks.find(t => t.kind === 'payment' && t.order && t.order.id === unpaid.id);
  step('unpaid order has a payment task', !!payment);
  step('payment task is not due before the production reminder day', payment && payment.due === false, { got: payment && payment.due });
  const quote = tasks.find(t => t.kind === 'quote' && t.appointment && t.appointment.outcome === 'quoted');
  step('old quote is due for follow-up', !!quote && quote.due === true, { got: quote && quote.due });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
