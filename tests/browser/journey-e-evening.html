<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>journey-d-driving</title></head>
<body>
<script src="../../js/vendor/dexie.min.js"></script>
<script>
/* ============================================
   JOURNEY D — DRIVING
   Today's visits → suggested route → navigation → trip tracking → arrival → distance
   ============================================ */
(async () => {
  const results = [];
  const step = (label, cond, extra) => results.push({ label, pass: !!cond, extra: extra || null });

  const db = new Dexie('advisoros_v6');
  db.version(1).stores({
    customers: '++id, customerNumber, firstName, lastName, phone, email, postcodeNormalized, source, status, createdAt',
    appointments: '++id, customerId, date, type, status, outcome, source, createdAt',
    orders: '++id, customerId, appointmentId, orderNumber, supplierOrderNumber, status, createdAt',
    expenses: '++id, date, category, amount, tripId, createdAt',
    trips: '++id, date, appointmentId, purpose, confirmed, createdAt',
    measurements: '++id, appointmentId, windowName, createdAt',
    communications: '++id, customerId, type, template, sentAt',
    settings: 'key',
    sequences: 'name'
  });
  await db.open();

  const iso = d => d.toISOString();
  const today = new Date();
  today.setHours(8, 0, 0, 0);

  // Seed: 3 visits today with coordinates
  const cid = await db.customers.add({
    firstName: 'Route', lastName: 'Customer', phone: '07700 900123',
    customerNumber: 'CUS-' + today.getFullYear() + '-0001', status: 'active', createdAt: iso(new Date(today.getTime() - 30 * 86400000))
  });

  const baseLatLng = [53.4750, -2.2500];
  await db.settings.put({ key: 'config', value: { businessAddress: '5 Business Park, Manchester M3 3CC', businessLatLng: baseLatLng } });

  // Visit 1: 10:00 - M1 1AA
  const appt1 = await db.appointments.add({
    customerId: cid, date: iso(new Date(today.getTime() + 2 * 3600000)),
    type: 'consultation', status: 'confirmed', outcome: null,
    address: '10 High Street, Manchester M1 1AA', latLng: [53.4808, -2.2426],
    source: 'manual', createdAt: iso(new Date(today.getTime() - 1 * 86400000))
  });

  // Visit 2: 12:00 - M2 2BB
  const appt2 = await db.appointments.add({
    customerId: cid, date: iso(new Date(today.getTime() + 4 * 3600000)),
    type: 'measure', status: 'confirmed', outcome: null,
    address: '20 King Street, Manchester M2 2BB', latLng: [53.4850, -2.2300],
    source: 'manual', createdAt: iso(new Date(today.getTime() - 1 * 86400000))
  });

  // Visit 3: 15:00 - M3 3CC
  const appt3 = await db.appointments.add({
    customerId: cid, date: iso(new Date(today.getTime() + 7 * 3600000)),
    type: 'fitting', status: 'confirmed', outcome: null,
    address: '30 Queen Street, Manchester M3 3CC', latLng: [53.4780, -2.2450],
    source: 'manual', createdAt: iso(new Date(today.getTime() - 1 * 86400000))
  });

  // --- TODAY'S VISITS ---
  const visits = (await db.appointments.toArray())
    .filter(a => new Date(a.date).toDateString() === today.toDateString() && a.status !== 'cancelled')
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  step('JOURNEY D: 3 visits today', visits.length === 3);

  // --- SUGGESTED ROUTE: Nearest neighbour from base ---
  const withCoords = visits.filter(v => Array.isArray(v.latLng) && v.latLng.length === 2);
  step('JOURNEY D: All visits have coordinates', withCoords.length === 3);

  // Simulate nearest neighbour ordering from base
  let current = baseLatLng;
  const ordered = [];
  const unvisited = [...withCoords];
  while (unvisited.length > 0) {
    let nearest = null, nearestDist = Infinity, nearestIdx = -1;
    for (let i = 0; i < unvisited.length; i++) {
      const appt = unvisited[i];
      const dLat = current[0] - appt.latLng[0];
      const dLng = current[1] - appt.latLng[1];
      const dist = Math.sqrt(dLat*dLat + dLng*dLng) * 111; // rough km
      if (dist < nearestDist) { nearestDist = dist; nearest = appt; nearestIdx = i; }
    }
    if (nearest) { ordered.push(nearest); current = nearest.latLng; unvisited.splice(nearestIdx, 1); }
  }
  step('JOURNEY D: Route optimization produces ordered stops', ordered.length === 3);

  // --- NAVIGATION: Google Maps URL for first leg ---
  const firstVisit = visits[0];
  const navUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent('5 Business Park, Manchester M3 3CC')}&destination=${encodeURIComponent(firstVisit.address)}`;
  step('JOURNEY D: Navigation URL contains base and destination', navUrl.includes('Business Park') && navUrl.includes('High Street'));

  // --- TRIP TRACKING: Start trip for first visit ---
  // Simulate Geo.startTrip
  const startPos = { lat: baseLatLng[0], lng: baseLatLng[1] };
  const trip = {
    id: 'trip-' + Date.now(),
    startTime: new Date().toISOString(),
    startLocation: 'Base',
    destinationAddress: firstVisit.address,
    destination: firstVisit.latLng,
    appointmentId: firstVisit.id,
    distanceKm: 0,
    path: [{ lat: startPos.lat, lng: startPos.lng }],
    lastPos: { lat: startPos.lat, lng: startPos.lng }
  };
  step('JOURNEY D: Trip object created with destination', !!trip.destination);

  // Simulate position updates (moving towards destination)
  const midPos = { lat: 53.478, lng: -2.246 }; // halfway
  const segment1 = Math.sqrt(Math.pow(midPos.lat - startPos.lat, 2) + Math.pow(midPos.lng - startPos.lng, 2)) * 111;
  trip.distanceKm += segment1;
  trip.path.push(midPos);
  trip.lastPos = midPos;
  step('JOURNEY D: Trip distance accumulates', trip.distanceKm > 0);

  // Simulate arrival
  const destPos = { lat: firstVisit.latLng[0], lng: firstVisit.latLng[1] };
  const segment2 = Math.sqrt(Math.pow(destPos.lat - midPos.lat, 2) + Math.pow(destPos.lng - midPos.lng, 2)) * 111;
  trip.distanceKm += segment2;
  trip.path.push(destPos);
  trip.lastPos = destPos;

  // Arrival check (within 150m)
  const distToDest = Math.sqrt(Math.pow(destPos.lat - trip.destination[0], 2) + Math.pow(destPos.lng - trip.destination[1], 2)) * 111;
  step('JOURNEY D: Arrival detected within radius', distToDest < 0.15);

  // --- FINISH TRIP: Road distance fallback ---
  // Simulate OSRM road distance (would be called in finishTrip)
  const straightKm = Math.sqrt(Math.pow(destPos.lat - startPos.lat, 2) + Math.pow(destPos.lng - startPos.lng, 2)) * 111;
  const roadKm = straightKm * 1.3; // typical road factor
  const finalDistance = Math.max(trip.distanceKm, roadKm);
  step('JOURNEY D: Final distance uses road fallback', finalDistance >= roadKm);

  // --- TRIP LOGGED ---
  await db.trips.add({
    date: trip.startTime, startLocation: 'Base', endLocation: firstVisit.address,
    distanceKm: finalDistance, purpose: 'business', appointmentId: firstVisit.id, autoTracked: true
  });
  const loggedTrip = (await db.trips.toArray()).find(t => t.appointmentId === firstVisit.id);
  step('JOURNEY D: Trip logged to database', !!loggedTrip);
  step('JOURNEY D: Trip distance recorded', loggedTrip?.distanceKm > 0);

  // --- NEXT VISIT: Navigation to second visit ---
  const secondVisit = visits[1];
  const navUrl2 = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(firstVisit.address)}&destination=${encodeURIComponent(secondVisit.address)}`;
  step('JOURNEY D: Navigation to next visit available', navUrl2.includes('King Street'));

  document.body.textContent = JSON.stringify({ journey: 'D', results });
})().catch(e => { document.body.textContent = 'SEED_FAILED:' + String(e && e.message || e); });
</script>
</body></html>
