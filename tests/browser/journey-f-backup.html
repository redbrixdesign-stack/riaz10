<body>
<div id="main"></div>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  // Test-mode encryption key (see app.js promptPassphrase test branch)
  await initEncryption("test-passphrase-123");
  await DB.deleteAllData();

  // The raw-CDP harness never answers JS dialogs, so the restore
  // confirmation (export.js importBackup) would hang the journey.
  window.confirm = () => true;

  const today = Utils.getToday();
  const at = (d, h) => { const dt = new Date(d); dt.setHours(h, 0, 0, 0); return dt.toISOString(); };

  // ---- Seed a realistic full data graph with production functions ----
  Object.assign(CONFIG, {
    advisorName: 'Test Advisor', weeklyTarget: 600,
    ai: { ...(CONFIG.ai || {}), secret: 'test-secret' }
  });

  const customer = await DB.addCustomer({
    firstName: 'Sarah', lastName: 'Johnson', fullName: 'Sarah Johnson', phone: '07700900123',
    address: { line1: '8 Test Lane', city: 'Manchester', postcode: 'M2 2BB', postcodeNormalized: 'M22BB' }
  });

  const pastAppt = await DB.addAppointment({
    customerId: customer.id, clientName: 'Sarah', type: 'consultation',
    date: at(Utils.addDays(today, -5), 11), status: 'completed', outcome: 'quoted', value: 1500,
    notes: 'wants to compare the bay window', latLng: [53.4808, -2.2426]
  });
  const upcomingAppt = await DB.addAppointment({
    customerId: customer.id, clientName: 'Sarah', type: 'measure',
    date: at(Utils.addDays(today, 3), 10)
  });

  const measurement = await DB.addMeasurement({
    appointmentId: pastAppt.id, windowName: 'Living Room Bay',
    widthTop: 1100, widthMiddle: 1200, widthBottom: 1150,
    dropLeft: 1500, dropCentre: 1600, dropRight: 1550,
    tolerance: 10, fittingType: 'recess'
  });
  await DB.addMeasurement({
    appointmentId: pastAppt.id, windowName: 'Kitchen',
    widthTop: 900, widthMiddle: 910, widthBottom: 895,
    dropLeft: 1200, dropCentre: 1190, dropRight: 1210,
    tolerance: 10, fittingType: 'face'
  });

  const photoData = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
  await DB.addPhoto({ customerId: customer.id, data: photoData, mimeType: 'image/png', caption: 'Window photo' });

  const order = await DB.addOrder({ customerId: customer.id, appointmentId: pastAppt.id, total: 1500, notes: 'bay window + kitchen' });

  await DB.addTrip({ date: at(Utils.addDays(today, -5), 10), startLocation: 'Home base', endLocation: '8 Test Lane', distanceKm: 12.4, appointmentId: pastAppt.id });
  await DB.addExpense({ date: today.toISOString(), category: 'fuel', amount: 45.5, notes: 'week fuel' });
  await DB.addCommunication({ customerId: customer.id, appointmentId: pastAppt.id, type: 'whatsapp_attempted', template: 'follow_up.quote', content: 'Hi Sarah, following up on your quote' });
  await DB.setSetting('config', { advisorName: 'Test Advisor', weeklyTarget: 600 });

  // Advance sequence counters so the backup carries non-trivial values.
  await DB.getNextSequence('customer');
  await DB.getNextSequence('customer');
  const customerSeqBefore = await DB.db.sequences.get('customer');
  const snap = async () => ({
    customers: await DB.db.customers.count(),
    appointments: await DB.db.appointments.count(),
    orders: await DB.db.orders.count(),
    expenses: await DB.db.expenses.count(),
    trips: await DB.db.trips.count(),
    measurements: await DB.db.measurements.count(),
    communications: await DB.db.communications.count(),
    photos: await DB.db.photos.count(),
    settings: await DB.db.settings.count(),
    sequences: await DB.db.sequences.count()
  });
  const before = await snap();

  // ---- 1. Production export ----
  const backup = await ExportService.exportBackup();
  step('backup is format 1', backup.backupFormatVersion === 1 && backup.databaseSchemaVersion >= 2, { got: backup.backupFormatVersion });
  step('backup envelope carries every table', BACKUP_TABLES.every(t => Array.isArray(backup.data[t])), { got: Object.keys(backup.data) });
  step('backup never carries the AI secret', CONFIG.ai.secret === 'test-secret' && backup.config.ai.secret === undefined, { got: backup.config.ai && backup.config.ai.secret });

  // ---- 2. Production factory reset ----
  await DB.deleteAllData();
  const cleared = await snap();
  step('factory reset empties every table', Object.values(cleared).every(n => n === 0), { got: cleared });

  // ---- 3. Production import from the exported file ----
  const file = new File([JSON.stringify(backup)], 'advisoros_backup_test.json', { type: 'application/json' });
  await ExportService.importBackup(file);
  const restored = await snap();
  step('every table restored to its exported size', JSON.stringify(restored) === JSON.stringify(before), { got: { before, restored } });

  // ---- 4. Restored records keep their identity + relationships ----
  const restCustomer = await DB.getCustomer(customer.id);
  step('customer restored with number + profile',
    restCustomer && restCustomer.customerNumber === customer.customerNumber && restCustomer.phone === '07700900123' && restCustomer.status === 'active',
    { got: restCustomer && restCustomer.customerNumber });

  // Use the decrypting wrapper: notes is in APPT_PII_FIELDS, so the raw
  // table row holds the encrypted {iv, ct} object, not the string.
  const restPast = await DB.getAppointment(pastAppt.id);
  step('visit restored with outcome + value + notes',
    restPast && restPast.outcome === 'quoted' && restPast.value === 1500 && restPast.notes.includes('bay window'),
    { got: restPast && restPast.outcome });
  const restUpcoming = await DB.db.appointments.get(upcomingAppt.id);
  step('upcoming visit restored as confirmed', restUpcoming && restUpcoming.status === 'confirmed');

  const restMeasurement = await DB.db.measurements.get(measurement.id);
  step('measurement restored with derived fields',
    restMeasurement && restMeasurement.widthLeast === 1100 && restMeasurement.widthUsed === 1090 && restMeasurement.dropUsed === 1500,
    { got: restMeasurement && restMeasurement.widthLeast });

  const restOrder = await DB.db.orders.get(order.id);
  step('order restored with number + production deposit',
    restOrder && restOrder.orderNumber === order.orderNumber && restOrder.depositRequired === App.calculateDeposit(1500).amount && restOrder.balanceDue === 1500,
    { got: restOrder && restOrder.orderNumber });
  step('order points back at the restored visit', restOrder && (await DB.db.appointments.get(restOrder.appointmentId)) !== undefined);

  const restTrips = await DB.db.trips.toArray();
  step('trip restored with its distance', restTrips.length === 1 && restTrips[0].distanceKm === 12.4 && restTrips[0].appointmentId === pastAppt.id);
  const restExpenses = await DB.db.expenses.toArray();
  step('expense restored with its amount', restExpenses.length === 1 && restExpenses[0].amount === 45.5 && restExpenses[0].category === 'fuel');
  const restComms = await DB.db.communications.toArray();
  step('communication restored with its template', restComms.length === 1 && restComms[0].template === 'follow_up.quote');
  const restPhotos = await DB.db.photos.toArray();
  step('photo restored byte-for-byte', restPhotos.length === 1 && restPhotos[0].data === photoData && restPhotos[0].caption === 'Window photo');

  // ---- 5. Config + sequences restored with production rules ----
  step('config settings restored', CONFIG.weeklyTarget === 600 && CONFIG.advisorName === 'Test Advisor',
    { got: { weeklyTarget: CONFIG.weeklyTarget, advisorName: CONFIG.advisorName } });
  step('device AI secret survives the round-trip', CONFIG.ai.secret === 'test-secret', { got: CONFIG.ai.secret });
  const setting = await DB.getSetting('config');
  step('settings table restored', setting && setting.weeklyTarget === 600 && setting.advisorName === 'Test Advisor');

  const seqRestored = await DB.db.sequences.get('customer');
  const nextCustomerSeq = await DB.getNextSequence('customer');
  step('sequence counter survives and increments', seqRestored && nextCustomerSeq === customerSeqBefore.value + 1,
    { got: { restored: seqRestored && seqRestored.value, next: nextCustomerSeq } });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
</body>
</html>
