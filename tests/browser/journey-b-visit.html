<body>
<div id="main"></div>
<!-- Hidden form controls the production outcome modal reads from -->
<input id="outcome-value" value="2100">
<input id="outcome-discount" value="">
<input id="outcome-notes" value="">
<select id="outcome-reason"><option value=""></option></select>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  // Test-mode encryption key (see app.js promptPassphrase test branch)
  await initEncryption("test-passphrase-123");
  await DB.deleteAllData();

  const customer = await DB.addCustomer({
    firstName: 'Sarah', lastName: 'Johnson', fullName: 'Sarah Johnson', phone: '07700900123',
    address: { line1: '8 Test Lane', city: 'Manchester', postcode: 'M2 2BB', postcodeNormalized: 'M22BB' }
  });

  const fiveDaysAgo = Utils.addDays(Utils.getToday(), -5);
  const at = (d, h) => { const dt = new Date(d); dt.setHours(h, 0, 0, 0); return dt.toISOString(); };

  const pastAppt = await DB.addAppointment({
    customerId: customer.id, type: 'consultation',
    date: at(fiveDaysAgo, 11), status: 'completed', outcome: 'quoted', value: 1250
  });

  const measurement = await DB.addMeasurement({
    appointmentId: pastAppt.id,
    windowName: 'Living Room Bay',
    widthTop: 1100, widthMiddle: 1200, widthBottom: 1150,
    dropLeft: 1500, dropCentre: 1600, dropRight: 1550,
    tolerance: 10, fittingType: 'recess'
  });

  await DB.addCommunication({
    customerId: customer.id, appointmentId: pastAppt.id,
    type: 'whatsapp_attempted', template: 'follow_up.quote', content: 'Hi Sarah, following up on your quote'
  });

  // The fitting must be UPCOMING for the Companion facts below to classify
  // it as the next visit (a "today at 14:00" fixture breaks when the suite
  // runs after 14:00 — the visit lands in lastVisit with no outcome yet).
  const fitTime = new Date(Date.now() + 60 * 60 * 1000); // 1h from now
  const todayAppt = await DB.addAppointment({
    customerId: customer.id, clientName: 'Sarah', type: 'fitting',
    date: at(fitTime, fitTime.getHours())
  });

  // 1. Search finds the customer through production search.
  const found = await DB.searchCustomers('Sarah');
  step('customer search finds Sarah', found.length === 1 && found[0].firstName === 'Sarah', { got: found.length });

  // 2. Companion profile brief uses the real visit history.
  const profile = await CompanionFeature.answerPerson('Sarah Johnson');
  const fact = l => (profile.facts.find(f => f.label === l) || {}).value;
  step('Companion surfaces last visit with its real outcome', String(fact('Last visit')).includes('quoted'), { got: fact('Last visit') });
  const fitHourLabel = String(fitTime.getHours()).padStart(2, '0') + ':00';
  step('Companion surfaces the upcoming fitting', String(fact('Next visit')).includes(fitHourLabel), { got: fact('Next visit') });
  step('intro draft is flagged as not sent for the new visit', fact('Intro message') === 'Not sent yet', { got: fact('Intro message') });
  step('profile text names the customer', profile.text.startsWith('Sarah Johnson'), { got: profile.text });

  // 3. Measurements recorded through production calculate the derived fields.
  step('least width is the smallest of the three', measurement.widthLeast === 1100, { got: measurement.widthLeast });
  step('least drop is the smallest of the three', measurement.dropLeast === 1500, { got: measurement.dropLeast });
  step('recess width used = least minus tolerance', measurement.widthUsed === 1090, { got: measurement.widthUsed });
  step('drop used = least drop', measurement.dropUsed === 1500, { got: measurement.dropUsed });
  step('no diagonals → variance is null', measurement.diagonalVariance === null && measurement.isSquare === null);

  // 4. The fitting visit exists and is the only one booked for its day.
  const todays = await DB.getAppointmentsForDate(fitTime.toISOString());
  step('the fitting visit exists and is the only one', todays.length === 1 && todays[0].type === 'fitting', { got: todays.length });

  // 5. Record the outcome through the production save path (real DB write,
  //    real order upsert + real customer totals refresh).
  await AppointmentsFeature.saveOutcome(todayAppt.id, 'ordered');
  const saved = await DB.db.appointments.get(todayAppt.id);
  step('visit completed with ordered outcome', saved.status === 'completed' && saved.outcome === 'ordered');
  step('sale value recorded', saved.value === 2100, { got: saved.value });
  step('commission matches production estimate', saved.commission === TaxCalculator.estimateCommission(2100), { got: saved.commission });

  const order = await DB.db.orders.where('appointmentId').equals(todayAppt.id).first();
  step('order created for the sale', !!order);
  step('deposit is production-calculated (50% of 2100)', order && order.depositRequired === App.calculateDeposit(2100).amount, { got: order && order.depositRequired });
  step('balance due is the full sale', order && order.balanceDue === 2100, { got: order && order.balanceDue });
  step('order starts deposit_pending', order && order.status === 'deposit_pending', { got: order && order.status });

  const totals = await DB.db.customers.get(customer.id);
  step('customer totals refreshed from the order', totals.totalOrdersValue === 2100 && totals.orderCount === 1,
    { got: { totalOrdersValue: totals.totalOrdersValue, orderCount: totals.orderCount } });

  // 6. The follow-up communication from the quote is on record.
  const comms = await DB.db.communications.where('customerId').equals(customer.id).toArray();
  step('quote follow-up communication recorded', comms.length === 1 && comms[0].template === 'follow_up.quote', { got: comms.length });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
</body>
</html>
