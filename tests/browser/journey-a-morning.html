<body>
<div id="main"></div>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  // Test-mode encryption key (see app.js promptPassphrase test branch)
  await initEncryption("test-passphrase-123");
  await DB.deleteAllData();

  Object.assign(CONFIG, {
    businessAddress: '1 Test Street, Manchester',
    businessLatLng: [53.475, -2.25],
    weeklyTarget: 600,
    autoMessages: { enabled: true, eveningHour: 18, morningHour: 8 },
    templates: {
      evening_before: 'Hi {firstName}, just a quick reminder about your visit tomorrow at {time}. See you then!',
      morning_of: 'Hi {firstName}, looking forward to seeing you at {time} today.'
    }
  });

  const customer = await DB.addCustomer({
    firstName: 'John', lastName: 'Smith', phone: '07123456789',
    address: { line1: '12 Test Road', city: 'Manchester', postcode: 'M1 1AA', postcodeNormalized: 'M11AA' }
  });

  const today = Utils.getToday();
  const tomorrow = Utils.addDays(today, 1);
  // Seed "today" visits at a FUTURE time of the current UK day (30/60 min
  // from now, clamped before 23:59) so the production scheduler's upcoming
  // window (now → +7 days) always contains them at any run hour — a fixed
  // 23:00/23:30 fixture silently fell out of the window after ~23:30 UK.
  const at = (d, h, m = 0) => { const dt = new Date(d); dt.setHours(h, m, 0, 0); return dt.toISOString(); };
  const endOfToday = new Date(at(today, 23, 59)).getTime();
  const seed1 = new Date(Math.min(Date.now() + 30 * 60 * 1000, endOfToday));
  const seed2 = new Date(Math.min(seed1.getTime() + 30 * 60 * 1000, endOfToday));

  const appt1 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: seed1.toISOString(), latLng: [53.4808, -2.2426]
  });
  const appt2 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'measure',
    date: seed2.toISOString(), latLng: [53.4830, -2.2600]
  });
  const appt3 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(tomorrow, 10), latLng: [53.4700, -2.2400]
  });

  // 1. Production read of today's visits — count, ownership, ordering.
  const todays = await DB.getAppointmentsForDate(Utils.getToday().toISOString());
  step('today has exactly 2 visits', todays.length === 2, { got: todays.length });
  step('both visits belong to the right customer', todays.every(a => a.customerId === customer.id));
  const sorted = [...todays].sort((a, b) => new Date(a.date) - new Date(b.date));
  step('visits are ordered by time of day', todays[0].id === sorted[0].id && new Date(todays[0].date) <= new Date(todays[1].date));
  step('first visit is the morning consultation', todays[0].type === 'consultation', { got: todays[0].type });
  step('second visit is the measure', todays[1].type === 'measure', { got: todays[1].type });

  // 2. Companion brief for the morning uses the REAL visit data.
  const brief = await CompanionFeature.answerToday();
  const fact = l => (brief.facts.find(f => f.label === l) || {}).value;
  step('Companion counts 2 visits today', fact('Visits today') === '2', { got: fact('Visits today') });
  step('Companion names the next customer from the real visit', String(fact('Next up')).startsWith('John'), { got: fact('Next up') });
  step('brief text says how many visits are left', brief.text.includes('2 visits to go'), { got: brief.text });

  // 3. Communication scheduling — morning-of timers for today's visits,
  //    day-before + morning-of for tomorrow's, none day-before for today's.
  await MessageScheduler.reschedule();
  const key = (stage, id) => 'advisoros_auto_' + stage + '_' + id;
  step('morning-of scheduled for both today visits',
    MessageScheduler.timers.has(key('morning_of', appt1.id)) && MessageScheduler.timers.has(key('morning_of', appt2.id)));
  step('no day-before timer for today visits',
    !MessageScheduler.timers.has(key('evening_before', appt1.id)) && !MessageScheduler.timers.has(key('evening_before', appt2.id)));
  step('day-before + morning-of scheduled for tomorrow visit',
    MessageScheduler.timers.has(key('evening_before', appt3.id)) && MessageScheduler.timers.has(key('morning_of', appt3.id)));
  step('no on-my-way timers scheduled from the schedule pass',
    !MessageScheduler.timers.has(key('on_my_way', appt1.id)) && !MessageScheduler.timers.has(key('on_my_way', appt2.id)) && !MessageScheduler.timers.has(key('on_my_way', appt3.id)));

  // 4. Duplicate-prevention: a fired stage must not re-schedule.
  localStorage.setItem(key('morning_of', appt1.id), '1');
  MessageScheduler._clearTimers();
  await MessageScheduler.reschedule();
  step('fired stage is not re-scheduled',
    !MessageScheduler.timers.has(key('morning_of', appt1.id)) && MessageScheduler.timers.has(key('morning_of', appt2.id)));

  // 5. Route plan uses the REAL base point + visits and builds the loop.
  const base = await RouteFeature.getBasePoint();
  step('route base comes from stored business location',
    Array.isArray(base.latLng) && Math.abs(base.latLng[0] - 53.475) < 0.0001 && Math.abs(base.latLng[1] - (-2.25)) < 0.0001);
  const plan = RouteFeature.analyseDay(await DB.getAppointmentsForDate(Utils.getToday().toISOString()), Utils.getToday(), base);
  step('route plan contains both visits', plan.appointments.length === 2, { got: plan.appointments.length });
  step('route loop = base + both visits + return (3 legs)', plan.legs.length === 3, { got: plan.legs.length });
  step('first leg goes to the morning visit', plan.legs[0].to && plan.legs[0].to.appointment && plan.legs[0].to.appointment.id === appt1.id);
  step('final leg returns to base', plan.legs[2].isReturn === true, { got: plan.legs[2].isReturn });
  step('route distance is a real positive number', typeof plan.currentLegKm === 'number' && plan.currentLegKm > 0, { got: plan.currentLegKm });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
</body>
</html>
