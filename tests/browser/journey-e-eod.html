<body>
<div id="main"></div>
<!-- Hidden form controls the production outcome modal reads from -->
<input id="outcome-value" value="1800">
<input id="outcome-discount" value="">
<input id="outcome-notes" value="">
<select id="outcome-reason"><option value=""></option></select>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  await DB.deleteAllData();

  Object.assign(CONFIG, { weeklyTarget: 600 });

  const customer = await DB.addCustomer({ firstName: 'John', lastName: 'Smith', fullName: 'John Smith', phone: '07123456789' });
  const today = Utils.getToday();
  const at = (d, h, m = 0) => { const dt = new Date(d); dt.setHours(h, m, 0, 0); return dt.toISOString(); };

  // Two orders completed this week (today), one old quoted lead, an unpaid
  // order, and two visits still awaiting their outcome.
  const sale1 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(today, 9), status: 'completed', outcome: 'ordered', value: 2000
  });
  const sale2 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(today, 10), status: 'completed', outcome: 'ordered', value: 950
  });
  await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(Utils.addDays(today, -6), 14), status: 'completed', outcome: 'quoted', value: 1250
  });
  const unpaid = await DB.addOrder({
    customerId: customer.id, total: 1200
  });
  const fitting = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'fitting', date: at(today, 13)
  });
  const measure = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'measure', date: at(today, 15, 30)
  });

  // 1. Canonical week stats come from production DB.getWeekStats.
  const stats = await DB.getWeekStats(Utils.getStartOfWeek().toISOString(), Utils.getEndOfWeek().toISOString());
  const expectedEarnings = TaxCalculator.estimateCommission(2000) + TaxCalculator.estimateCommission(950);
  step('week sales = the two real orders', stats.sales === 2950, { got: stats.sales });
  step('week earnings = production commission on both orders', stats.earnings === expectedEarnings, { got: stats.earnings });
  step('week order count = 2', stats.orderedCount === 2, { got: stats.orderedCount });

  // 2. Companion week brief uses the canonical stats.
  const week = await CompanionFeature.answerWeek();
  const wfact = l => (week.facts.find(f => f.label === l) || {}).value;
  step('week brief earnings match production stats', wfact('Earnings') === Utils.formatCurrency(stats.earnings), { got: wfact('Earnings') });
  step('week brief sales match production stats', wfact('Sales value') === Utils.formatCurrency(2950), { got: wfact('Sales value') });
  step('week brief order count is 2', wfact('Orders') === '2', { got: wfact('Orders') });

  // 3. Evening review BEFORE completing today's outstanding visits.
  const before = await CompanionFeature.answerEveningReview();
  const bfact = l => (before.facts.find(f => f.label === l) || {}).value;
  step('evening review flags both unlogged visits', bfact('Outcomes not logged') === '2 visits today', { got: bfact('Outcomes not logged') });
  step('evening review reports the unpaid order', bfact('Outstanding') === Utils.formatCurrency(1200) + ' over 1 order', { got: bfact('Outstanding') });
  step('evening review counts the due follow-ups (quote + 2 visits)', bfact('Follow-ups due') === '3 tasks', { got: bfact('Follow-ups due') });

  // 4. Log the two outstanding outcomes through the production save path.
  await AppointmentsFeature.saveOutcome(fitting.id, 'completed');
  await AppointmentsFeature.saveOutcome(measure.id, 'measured');

  const fittingSaved = await DB.db.appointments.get(fitting.id);
  const measureSaved = await DB.db.appointments.get(measure.id);
  step('fitting outcome logged by production path', fittingSaved.outcome === 'completed' && fittingSaved.status === 'completed');
  step('measure outcome logged by production path', measureSaved.outcome === 'measured' && measureSaved.status === 'completed');

  // 5. Evening review AFTER — nothing left to log, money and tasks remain.
  const after = await CompanionFeature.answerEveningReview();
  const afact = l => (after.facts.find(f => f.label === l) || {}).value;
  step('no outcomes outstanding after logging', afact('Outcomes not logged') === undefined, { got: afact('Outcomes not logged') });
  step('unpaid order still reported', afact('Outstanding') === Utils.formatCurrency(1200) + ' over 1 order', { got: afact('Outstanding') });
  step('only the quote follow-up remains due', afact('Follow-ups due') === '1 task', { got: afact('Follow-ups due') });

  // 6. Task inbox reflects production payment logic (3-day reminder).
  const tasks = await FollowupsFeature.loadTasks();
  const payment = tasks.find(t => t.kind === 'payment' && t.order && t.order.id === unpaid.id);
  step('unpaid order has a payment reminder task', !!payment);
  step('payment reminder is not due before production reminder day', payment && payment.due === false, { got: payment && payment.due });
  step('payment task names the balance to collect',
    payment && payment.action === 'Collect ' + Utils.formatCurrency(1200) + ' (deposit ' + Utils.formatCurrency(0) + ' of ' + Utils.formatCurrency(App.calculateDeposit(1200).amount) + ')',
    { got: payment && payment.action });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
</body>
</html>
