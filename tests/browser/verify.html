<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>verify</title></head>
<body>
<script src="../../js/vendor/dexie.min.js"></script>
<script>
// Reads the migrated 'advisoros_v6' database and reports what it finds into
// the DOM so the CDP driver can assert on the real migrated state.
(async () => {
  const db = new Dexie('advisoros_v6');
  db.version(1).stores({
    customers: '++id, customerNumber, firstName, lastName, phone, email, postcodeNormalized, source, status, createdAt',
    appointments: '++id, customerId, date, type, status, outcome, source, createdAt',
    orders: '++id, customerId, appointmentId, orderNumber, supplierOrderNumber, status, createdAt',
    expenses: '++id, date, category, amount, tripId, createdAt',
    trips: '++id, date, appointmentId, purpose, confirmed, createdAt',
    measurements: '++id, appointmentId, windowName, createdAt',
    communications: '++id, customerId, type, template, sentAt',
    settings: 'key',
    sequences: 'name'
  });
  await db.open();
  const customers = await db.customers.toArray();
  const appts = await db.appointments.toArray();
  const orders = await db.orders.toArray();
  const expenses = await db.expenses.toArray();
  const seq = await db.sequences.get('customer');
  const flag = await db.settings.get('__v6_legacy_migrated__');
  const config = await db.settings.get('config');
  document.body.textContent = JSON.stringify({
    customers: customers.length,
    customerNumbers: customers.map(c => c.customerNumber).sort().join(','),
    appts: appts.length,
    apptOutcomes: appts.map(a => a.outcome).sort().join(','),
    orders: orders.length,
    expenses: expenses.length,
    expenseAmounts: expenses.map(e => e.amount).join(','),
    seqCustomer: seq ? seq.value : null,
    flag: flag ? flag.value : null,
    configWeekly: config && config.value ? config.value.weeklyTarget : null
  });
})();
</script>
</body></html>
