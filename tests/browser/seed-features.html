<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>seed-features</title></head>
<body>
<script src="../../js/vendor/dexie.min.js"></script>
<script>
// Seeds the CURRENT 'advisoros_v6' database with a realistic sales scenario
// used by the Customer 360 / Orders / Follow-ups browser E2E:
//   1 customer with a quoted visit (5d ago), a live order placed 10d ago
//   (stage 'ordered', deposit outstanding), a confirmed visit today
//   (outcome not logged) and a confirmed visit tomorrow.
// Layout mirrors verify.html so the schema exactly matches the app's.
(async () => {
  const db = new Dexie('advisoros_v6');
  db.version(1).stores({
    customers: '++id, customerNumber, firstName, lastName, phone, email, postcodeNormalized, source, status, createdAt',
    appointments: '++id, customerId, date, type, status, outcome, source, createdAt',
    orders: '++id, customerId, appointmentId, orderNumber, supplierOrderNumber, status, createdAt',
    expenses: '++id, date, category, amount, tripId, createdAt',
    trips: '++id, date, appointmentId, purpose, confirmed, createdAt',
    measurements: '++id, appointmentId, windowName, createdAt',
    communications: '++id, customerId, type, template, sentAt',
    settings: 'key',
    sequences: 'name'
  });
  await db.open();

  const iso = d => d.toISOString();
  const daysAgo = n => new Date(Date.now() - n * 86400000);
  const at = (d, h) => { const x = new Date(d); x.setHours(h, 0, 0, 0); return x; };

  const cid = await db.customers.add({
    firstName: 'Sarah', lastName: 'Johnson', phone: '07700 900123',
    customerNumber: 'CUS-' + new Date().getFullYear() + '-0001',
    status: 'active', createdAt: iso(daysAgo(60))
  });

  const quotedId = await db.appointments.add({
    customerId: cid, date: iso(daysAgo(5)), type: 'consultation',
    status: 'completed', outcome: 'quoted', value: 1250,
    source: 'manual', createdAt: iso(daysAgo(5))
  });

  await db.orders.add({
    customerId: cid, appointmentId: quotedId, orderNumber: 'ORD-2026-0001',
    supplierOrderNumber: '', status: 'active', total: 1250,
    depositRequired: 625, depositPaid: 0, balanceDue: 1250,
    stage: 'ordered', createdAt: iso(daysAgo(10))
  });

  await db.appointments.add({
    customerId: cid, date: iso(at(new Date(), 10)), type: 'fitting',
    status: 'confirmed', outcome: null, source: 'manual', createdAt: iso(daysAgo(1))
  });

  await db.appointments.add({
    customerId: cid, date: iso(at(new Date(Date.now() + 86400000), 14)), type: 'consultation',
    status: 'confirmed', outcome: null, source: 'manual', createdAt: iso(daysAgo(1))
  });

  await db.measurements.add({ appointmentId: quotedId, windowName: 'Lounge Bay', createdAt: iso(daysAgo(5)) });
  await db.sequences.bulkPut([{ name: 'customer', value: 5 }, { name: 'order', value: 5 }]);

  document.body.textContent = 'SEEDED_OK';
})().catch(e => { document.body.textContent = 'SEED_FAILED:' + String(e && e.message || e); });
</script>
</body></html>
