<script src="../../js/vendor/dexie.min.js"></script>
<script>
/* ============================================================
   ADVISOROS — VISUAL REVIEW SEED
   Seeds the CURRENT 'advisoros_v6' database with a rich, realistic
   demo dataset for the full visual review (screenshots). Repeatable:
   it clears every table first, then reseeds from scratch. Safe for
   local/dev only — it wipes whatever is in the browser's IndexedDB
   for this origin.

   Scenario: "Riaz Ahmed", window-coverings advisor based in
   Stockport/Manchester, weekly earnings target £1,800. A busy week
   with every Home day-strip state (Done / Overdue / Next / Upcoming),
   a follow-up inbox with every task kind, a kanban with every order
   column populated, money/travel history, edge cases (long text,
   missing optional fields, special characters, cancelled visits,
   incomplete measurements). End-to-end coverage: every lead source,
   every appointment type, every outcome across all six types,
   travel states (in transit / on site), all expense categories,
   communication templates, and message flags (sent vs unsent).

   Usage: serve the repo (npm run serve), open this page once, then
   open index.html in the SAME browser profile. It writes
   localStorage 'advisoros_config' too, so the app boots straight
   into the seeded world (no onboarding).
   ============================================================ */
(async () => {
  const db = new Dexie('advisoros_v6');
  db.version(1).stores({
    customers: '++id, customerNumber, firstName, lastName, phone, email, postcodeNormalized, source, status, createdAt',
    appointments: '++id, customerId, date, type, status, outcome, source, createdAt',
    orders: '++id, customerId, appointmentId, orderNumber, supplierOrderNumber, status, createdAt',
    expenses: '++id, date, category, amount, tripId, createdAt',
    trips: '++id, date, appointmentId, purpose, confirmed, createdAt',
    measurements: '++id, appointmentId, windowName, createdAt',
    communications: '++id, customerId, type, template, sentAt',
    settings: 'key',
    sequences: 'name'
  });
  db.version(2).stores({ photos: '++id, customerId, createdAt' });
  await db.open();

  // ---- wipe ----
  await Promise.all(['customers','appointments','orders','expenses','trips','measurements','communications','photos','settings','sequences'].map(t => db[t].clear()));

  // ---- UK wall-clock helpers (mirror the app's day contract) ----
  const ukFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const ukParts = d => { const p = {}; for (const x of ukFmt.formatToParts(d)) if (x.type !== 'literal') p[x.type] = parseInt(x.value, 10); return p; };
  const ukMidnight = (y, m, day) => { const guess = new Date(Date.UTC(y, m - 1, day)); const p = ukParts(guess); return new Date(guess.getTime() - (p.hour * 3600 + p.minute * 60 + p.second) * 1000); };
  const ukNow = () => { const p = ukParts(new Date()); const base = ukMidnight(p.year, p.month, p.day); return new Date(base.getTime() + (p.hour * 3600 + p.minute * 60 + p.second) * 1000); };
  // ISO instant at (today + offsetDays) at UK wall-clock hh:mm
  const ukDay = (offsetDays, hour, minute = 0) => {
    const p = ukParts(new Date());
    const base = ukMidnight(p.year, p.month, p.day);
    base.setDate(base.getDate() + offsetDays);
    base.setTime(base.getTime() + (hour * 3600 + minute * 60) * 1000);
    return base.toISOString();
  };
  const nowIso = () => new Date().toISOString();
  const daysAgo = n => new Date(Date.now() - n * 86400000).toISOString();
  // Monday of the current UK week (12:00) — for "this week" earnings.
  const ukMonday = () => {
    const p = ukParts(new Date());
    const dow = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay();
    const mondayDay = p.day - ((dow + 6) % 7);
    const base = ukMidnight(p.year, p.month, mondayDay);
    base.setTime(base.getTime() + 12 * 3600000);
    return base.toISOString();
  };
  // Guaranteed-past "today" visit (overdue state) — never earlier than
  // today 00:05 UK, never later than 10:00 UK.
  const overdueToday = () => {
    const clamp = new Date(Math.min(new Date(Date.now() - 45 * 60000).getTime(), new Date(ukDay(0, 10)).getTime()));
    const floor = new Date(ukDay(0, 0, 5)).getTime();
    return new Date(Math.max(clamp.getTime(), floor)).toISOString();
  };
  // Guaranteed-future "today" visit (Next state) — at least 45 min out.
  const nextToday = () => new Date(Math.max(new Date(ukDay(0, 11, 15)).getTime(), Date.now() + 45 * 60000)).toISOString();

  const YEAR = new Date().getFullYear();
  const C = n => 'CUS-' + YEAR + '-' + String(n).padStart(4, '0');
  const O = n => 'ORD-' + YEAR + '-' + String(n).padStart(4, '0');

  // ---- config (localStorage + settings table) ----

    onboardingComplete: true,
    advisorName: 'Riaz Ahmed',
    companyName: 'Riaz Ahmed · Window Coverings',
    businessAddress: '12 Willow Works, Stockport Road, Manchester M16 0AA',
    businessLatLng: [53.415, -2.149],
    weeklyTarget: 1800,
    advisorMode: 'company',

    { firstName: 'John', lastName: 'Smith', phone: '07700 900456', email: 'john.smith@example.com', postcodeNormalized: 'M334AA', source: 'Google', address: { line1: '27 Oakfield Road', city: 'Sale', postcode: 'M33 4AA' } },
    { firstName: 'Amina', lastName: 'Patel', phone: '07900 111222', email: 'amina.patel@example.com', postcodeNormalized: 'M334BB', source: 'Instagram', address: { line1: '5 Ash Grove', city: 'Sale', postcode: 'M33 4BB' }, notes: 'New build. Wants blackout for the nursery.' },
    { firstName: "David", lastName: "O'Leary", phone: '07900 333444', email: 'david.oleary@example.com', postcodeNormalized: 'M222AA', source: 'Walk-in', address: { line1: "St Mary's Court, Flat 12", city: 'Altrincham', postcode: 'M22 2AA' }, notes: 'Conversation with the residents’ association led to two neighbours asking for the same brochure. Property is a conversion — check partition wall depth before quoting. Parking: visitors bay only. Access: key safe on the right of the main door.' },

    { firstName: 'Tom', lastName: 'Hardcastle', phone: '07900 555666', email: 'tom@example.com', postcodeNormalized: 'SK75AA', source: 'Show Home', address: { line1: '3 Cypress Close', city: 'Stockport', postcode: 'SK7 5AA' }, notes: 'Ordered for the whole ground floor. Wants everything finished before the school summer fair in July.' },

  // ---- appointments ----
  const appt = async (a) => (await db.appointments.add({ status: 'confirmed', outcome: null, value: 0, commission: 0, source: 'manual', ...a }));
  const aDone    = await appt({ customerId: SARAH,  clientName: 'Sarah Johnson',  date: ukDay(0, 9),  type: 'consultation', outcome: 'ordered',  value: 1850, commission: 277.5,  status: 'completed', latLng: [53.410, -2.157], address: '14 Beechwood Avenue, Stockport SK1 4AA', createdAt: daysAgo(6) });
  const aOverdue = await appt({ customerId: KHAN,   clientName: 'Mr & Mrs Khan',   date: overdueToday(), type: 'consultation', latLng: [53.418, -2.231], address: null, createdAt: daysAgo(2) });
  const aNext    = await appt({ customerId: JOHN,   clientName: 'John Smith',      date: nextToday(),    type: 'consultation', latLng: [53.424, -2.322], address: '27 Oakfield Road, Sale M33 4AA', createdAt: daysAgo(4) });
  const aUp1     = await appt({ customerId: AMELIA, clientName: 'Amelia Green',    date: ukDay(0, 14),   type: 'fitting',      latLng: [53.326, -2.233], address: '9 Birch Lane, Wilmslow SK9 5AA', notes: 'Bay window faces east — morning sun.' });

  const aTom1     = await appt({ customerId: TOM,    clientName: 'Tom Hardcastle',  date: ukDay(1, 9, 30), type: 'fitting', latLng: [53.360, -2.170], address: '3 Cypress Close, Stockport SK7 5AA' });

  const aHannah1  = await appt({ customerId: HANNAH, clientName: 'Hannah Whitfield', date: ukDay(1, 15),  type: 'consultation', latLng: [53.453, -2.257], address: '18 Dale Road, Manchester M16 2AA' });

  const aMon     = await appt({ customerId: AMELIA, clientName: 'Amelia Green',    date: ukMonday(),     type: 'consultation', outcome: 'ordered', value: 1260, commission: 189, status: 'completed', latLng: [53.326, -2.233], address: '9 Birch Lane, Wilmslow SK9 5AA' });
  const aWed     = await appt({ customerId: AMINA,  clientName: 'Amina Patel',     date: ukDay(2, 11),   type: 'measure', latLng: [53.430, -2.330], address: '5 Ash Grove, Sale M33 4BB' });

  const aNextWk1 = await appt({ customerId: AMELIA, clientName: 'Amelia Green',    date: ukDay(8, 10),   type: 'consultation', latLng: [53.326, -2.233], address: '9 Birch Lane, Wilmslow SK9 5AA' });
  const aNextWk2 = await appt({ customerId: JOHN,   clientName: 'John Smith',      date: ukDay(10, 14),  type: 'measure', latLng: [53.424, -2.322], address: '27 Oakfield Road, Sale M33 4AA' });

  // ---- demo appointments: a guaranteed spread across the current UK
  // ---- week (Mon–Sun), a few next week, and one next month. Weekday-
  // ---- anchored (not relative to today) so the Home week strip and My
  // ---- Day always show a full week no matter which day the seed runs on.
  // weekday: 0=Mon … 6=Sun of the current UK week; weekOffset adds weeks.
  const ukWeekday = (weekday, hour, minute = 0, weekOffset = 0) => {
    const p = ukParts(new Date());
    const dow = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay();
    const day = p.day - ((dow + 6) % 7) + weekday + weekOffset * 7;
    const base = ukMidnight(p.year, p.month, day);
    base.setTime(base.getTime() + (hour * 3600 + minute * 60) * 1000);
    return base.toISOString();
  };
  // Same day-of-month in the NEXT calendar month.
  const ukNextMonth = (dayOfMonth, hour, minute = 0) => {
    const p = ukParts(new Date());
    const year = p.month === 12 ? p.year + 1 : p.year;
    const month = p.month === 12 ? 1 : p.month + 1;
    const base = ukMidnight(year, month, dayOfMonth);
    base.setTime(base.getTime() + (hour * 3600 + minute * 60) * 1000);
    return base.toISOString();
  };
  // Nth day of the CURRENT month, clamped to never be in the future —
  // for "this month" money figures that must show in the Money screen.
  const thisMonthDay = (dayOfMonth, hour, minute = 0) => {
    const p = ukParts(new Date());
    const day = Math.min(dayOfMonth, Math.max(1, p.day));
    const base = ukMidnight(p.year, p.month, day);
    base.setTime(base.getTime() + (hour * 3600 + minute * 60) * 1000);
    return base.toISOString();
  };

  // This week — one visit on every weekday (all open, so the week strip
  // and diary are full; weekdays already past show in the strip/My Day,
  // future ones also appear in the Home feed).
  await appt({ customerId: SARAH,  clientName: 'Sarah Johnson',     date: ukWeekday(0, 9, 30),  type: 'consultation', latLng: [53.410, -2.157], address: '14 Beechwood Avenue, Stockport SK1 4AA' });
  await appt({ customerId: HANNAH, clientName: 'Hannah Whitfield',  date: ukWeekday(1, 10),     type: 'consultation', latLng: [53.453, -2.257], address: '18 Dale Road, Manchester M16 2AA' });
  await appt({ customerId: AMINA,  clientName: 'Amina Patel',       date: ukWeekday(2, 14, 30), type: 'measure',      latLng: [53.430, -2.330], address: '5 Ash Grove, Sale M33 4BB' });
  await appt({ customerId: KHAN,   clientName: 'Mr & Mrs Khan',     date: ukWeekday(3, 11),     type: 'measure',      latLng: [53.418, -2.231], address: '31 Larkspur Road, Manchester M22 5AA' });
  await appt({ customerId: JOHN,   clientName: 'John Smith',        date: ukWeekday(4, 16),     type: 'fitting',      latLng: [53.424, -2.322], address: '27 Oakfield Road, Sale M33 4AA' });
  await appt({ customerId: AMELIA, clientName: 'Amelia Green',      date: ukWeekday(5, 10, 30), type: 'fitting',      latLng: [53.326, -2.233], address: '9 Birch Lane, Wilmslow SK9 5AA' });
  await appt({ customerId: DAVID,  clientName: "David O'Leary",     date: ukWeekday(6, 12),     type: 'consultation', latLng: [53.400, -2.350], address: "St Mary's Court, Altrincham M22 2AA" });

  // Next week — a few spread across it.
  await appt({ customerId: TOM,    clientName: 'Tom Hardcastle',    date: ukWeekday(0, 10, 0, 1), type: 'fitting',      latLng: [53.360, -2.170], address: '3 Cypress Close, Stockport SK7 5AA' });
  await appt({ customerId: SARAH,  clientName: 'Sarah Johnson',     date: ukWeekday(2, 9, 30, 1), type: 'measure',      latLng: [53.410, -2.157], address: '14 Beechwood Avenue, Stockport SK1 4AA' });
  await appt({ customerId: AMELIA, clientName: 'Amelia Green',      date: ukWeekday(4, 14, 0, 1), type: 'consultation', latLng: [53.326, -2.233], address: '9 Birch Lane, Wilmslow SK9 5AA' });

  // Next month — one visit.
  await appt({ customerId: TOM,    clientName: 'Tom Hardcastle',    date: ukNextMonth(10, 11),   type: 'measure',      latLng: [53.360, -2.170], address: '3 Cypress Close, Stockport SK7 5AA' });

  const aTom2     = await appt({ customerId: TOM,    clientName: 'Tom Hardcastle',  date: ukDay(-1, 16),  type: 'fitting', outcome: 'completed', status: 'completed', latLng: [53.360, -2.170], address: '3 Cypress Close, Stockport SK7 5AA' });
  const aSarah3   = await appt({ customerId: SARAH,  clientName: 'Sarah Johnson',   date: daysAgo(2),     type: 'consultation', outcome: 'thinking',  status: 'completed', latLng: [53.410, -2.157], address: '14 Beechwood Avenue, Stockport SK1 4AA' });
  const aDavid1   = await appt({ customerId: DAVID,  clientName: "David O'Leary",   date: daysAgo(3),     type: 'service_call', outcome: 'parts_needed', status: 'completed', latLng: [53.400, -2.350], address: "St Mary's Court, Altrincham M22 2AA", notes: 'Blind jammed after install — bracket bolt sheared. Ordered replacement bracket.' });
  const aKhan1    = await appt({ customerId: KHAN,   clientName: 'Mr & Mrs Khan',   date: daysAgo(5),     type: 'consultation', outcome: 'quoted', value: 980, status: 'completed', latLng: [53.418, -2.231], address: '31 Larkspur Road, Manchester M22 5AA' });
  const aDavid2   = await appt({ customerId: DAVID,  clientName: "David O'Leary",   date: daysAgo(8),     type: 'consultation', outcome: 'quoted', value: 1250, status: 'completed', latLng: [53.400, -2.350], address: "St Mary's Court, Altrincham M22 2AA" });

  // ---- SCENARIO MATRIX: every appointment type × every outcome ----
