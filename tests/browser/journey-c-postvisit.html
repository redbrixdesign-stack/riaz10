<body>
<div id="main"></div>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  await DB.deleteAllData();

  const at = (d, h) => { const dt = new Date(d); dt.setHours(h, 0, 0, 0); return dt.toISOString(); };

  const customer = await DB.addCustomer({ firstName: 'John', lastName: 'Smith', fullName: 'John Smith', phone: '07123456789' });

  // One 6-day-old completed visit per production outcome (9 in total).
  const outcomes = Object.keys(TalkFeature.OUTCOME_TEMPLATE_MAP);
  const sixDaysAgo = Utils.addDays(Utils.getToday(), -6);
  const seeded = {};
  for (const o of outcomes) {
    seeded[o] = await DB.addAppointment({
      customerId: customer.id, clientName: 'John', type: 'consultation',
      date: at(sixDaysAgo, 10), status: 'completed', outcome: o, value: 800
    });
  }

  // A quoted visit only 2 days old — follow-up exists but is not yet due.
  const quoteTwoDays = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(Utils.addDays(Utils.getToday(), -2), 14), status: 'completed', outcome: 'quoted', value: 1250
  });

  // A fitting completed yesterday — post-fit thank-you task.
  const fitted = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'fitting',
    date: at(Utils.addDays(Utils.getToday(), -1), 11), status: 'completed', outcome: 'completed'
  });

  // A fitting with a service failure 2 days ago — service acknowledgement task.
  const serviceOutcome = TalkFeature.SERVICE_OUTCOMES.fitting[0];
  const serviceVisit = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'fitting',
    date: at(Utils.addDays(Utils.getToday(), -2), 12), status: 'completed', outcome: serviceOutcome
  });

  // A brand-new customer with a booking next week — intro message task.
  const newcomer = await DB.addCustomer({ firstName: 'Peter', lastName: 'Brown', fullName: 'Peter Brown', phone: '07711122233' });
  const introVisit = await DB.addAppointment({
    customerId: newcomer.id, clientName: 'Peter', type: 'consultation',
    date: at(Utils.addDays(Utils.getToday(), 7), 10)
  });

  // A completed 'ordered' visit today — for the post-visit Companion brief.
  const orderedToday = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(Utils.getToday(), 9), status: 'completed', outcome: 'ordered', value: 1900
  });

  const tasks = await FollowupsFeature.loadTasks();

  // 1. Every production outcome generates a quote-chase task with the
  //    production template + action, due after 6 days. ('ordered' and
  //    'spec_mismatch' are excluded: production routes a sale to the order/
  //    payment tasks and a spec mismatch to the service task instead.)
  const quoteOutcomes = outcomes.filter(o => o !== 'ordered' && o !== 'spec_mismatch');
  for (const o of quoteOutcomes) {
    const match = TalkFeature.getTemplateForOutcome(o);
    const task = tasks.find(t => t.kind === 'quote' && t.appointment && t.appointment.id === seeded[o].id);
    step(`quote task created for outcome '${o}'`, !!task);
    step(`task for '${o}' uses the production template`, task && task.template === match.template, { got: task && task.template });
    step(`task for '${o}' uses the production action`, task && task.action === match.action, { got: task && task.action });
    step(`6-day-old '${o}' visit is due for follow-up`, task && task.due === true, { got: task && task.due });
  }
  step("no quote-chase task for a completed 'ordered' sale",
    !tasks.some(t => t.kind === 'quote' && t.appointment && t.appointment.id === seeded.ordered.id));
  step("no quote-chase task for a 'spec_mismatch' outcome",
    !tasks.some(t => t.kind === 'quote' && t.appointment && t.appointment.id === seeded.spec_mismatch.id));

  // 2. A recent quote is tracked but NOT due yet (production timing rule).
  const recentQuote = tasks.find(t => t.kind === 'quote' && t.appointment && t.appointment.id === quoteTwoDays.id);
  step('2-day-old quote has a follow-up task', !!recentQuote);
  step('2-day-old quote is not yet due', recentQuote && recentQuote.due === false, { got: recentQuote && recentQuote.due });

  // 3. Completed fitting → post-fit thank-you task; failed fitting → service task.
  const postFit = tasks.find(t => t.kind === 'post_fit' && t.appointment && t.appointment.id === fitted.id);
  step('completed fitting gets a post-fit task', !!postFit && postFit.template === 'post_fit_followup', { got: postFit && postFit.template });
  const service = tasks.find(t => t.kind === 'service' && t.appointment && t.appointment.id === serviceVisit.id);
  step(`failed fitting (${serviceOutcome}) gets a service task`, !!service && service.template === 'service_or_issue_followup', { got: service && service.template });

  // 4. First-time customer with a booking → intro task (production comms spec).
  const intro = tasks.find(t => t.kind === 'intro' && t.appointment && t.appointment.id === introVisit.id);
  step('first-time customer gets an intro task', !!intro && intro.template === 'pre_intro', { got: intro && intro.template });

  // 5. Post-visit Companion brief reflects the real day.
  const brief = await CompanionFeature.answerAfterVisit();
  const fact = l => (brief.facts.find(f => f.label === l) || {}).value;
  step('post-visit brief names the last visit from real data', String(fact('Last visit')).startsWith('John'), { got: fact('Last visit') });
  step('ordered sale suggests the production confirm-order action',
    brief.actions.some(a => a.label === 'Send Confirm order placed'), { got: brief.actions.map(a => a.label) });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
</body>
</html>
