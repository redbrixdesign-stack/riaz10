<body>
<div id="main"></div>
<script>
window.addEventListener("load", async () => {
  const results = [];
  try {
  const step = (label, pass, extra) => results.push({ label, pass, extra });

  await DB.init();
  // Test-mode encryption key (see app.js promptPassphrase test branch)
  await initEncryption("test-passphrase-123");
  await DB.deleteAllData();
  try { Geo.init(); } catch (e) { /* banner needs no DOM here */ }

  Object.assign(CONFIG, {
    businessAddress: '1 Test Street, Manchester',
    businessLatLng: [53.475, -2.25],
    autoMessages: { enabled: true, eveningHour: 18, morningHour: 8 }
  });

  const customer = await DB.addCustomer({ firstName: 'John', lastName: 'Smith', fullName: 'John Smith', phone: '07123456789' });
  const today = Utils.getToday();
  const at = (d, h, m = 0) => { const dt = new Date(d); dt.setHours(h, m, 0, 0); return dt.toISOString(); };

  const v1 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'consultation',
    date: at(today, 23, 0), address: '12 Test Road', latLng: [53.4808, -2.2426]
  });
  const v2 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'measure',
    date: at(today, 23, 15), address: '3 Test Avenue', latLng: [53.4830, -2.2600]
  });
  const v3 = await DB.addAppointment({
    customerId: customer.id, clientName: 'John', type: 'fitting',
    date: at(today, 23, 30), address: '9 Test Close', latLng: [53.4700, -2.2400]
  });

  const base = await RouteFeature.getBasePoint();
  step('base point comes from the stored business location',
    Array.isArray(base.latLng) && Math.abs(base.latLng[0] - 53.475) < 0.0001 && Math.abs(base.latLng[1] - (-2.25)) < 0.0001);

  // 1. Route plan — production analyseDay over the real visit set.
  const plan = RouteFeature.analyseDay(await DB.getAppointmentsForDate(Utils.getToday().toISOString()), Utils.getToday(), base);
  step('route plan covers all three visits', plan.appointments.length === 3, { got: plan.appointments.length });
  step('route loop = base + 3 stops + return (4 legs)', plan.legs.length === 4, { got: plan.legs.length });
  step('first leg goes to the first visit', plan.legs[0].to && plan.legs[0].to.appointment && plan.legs[0].to.appointment.id === v1.id);
  step('final leg returns to base', plan.legs[3].isReturn === true, { got: plan.legs[3].isReturn });
  step('route distance is a real positive number', typeof plan.currentLegKm === 'number' && plan.currentLegKm > 0, { got: plan.currentLegKm });

  // 2. Real Geo functions (production provider, not a test re-implementation).
  const dist = Geo.calculateDistance(53.475, -2.25, 53.4808, -2.2426);
  step('Geo.calculateDistance returns a positive distance', typeof dist === 'number' && dist > 0, { got: dist });

  const optimized = await Geo.optimizeRoute(
    await DB.getAppointmentsForDate(Utils.getToday().toISOString()),
    base.latLng
  );
  step('optimizeRoute keeps every visit exactly once',
    Array.isArray(optimized) && optimized.length === 3 &&
    new Set(optimized.map(a => a.id)).size === 3 &&
    [v1, v2, v3].every(v => optimized.some(a => a.id === v.id)));

  const navUrl = Geo.buildNavigationUrl('12 Test Road', '1 Test Street');
  step('navigation URL is a real Google Maps handoff',
    navUrl.startsWith('https://www.google.com/maps/dir/?api=1') && navUrl.includes('destination=') && navUrl.includes('origin='),
    { got: navUrl });

  // 3. Trip tracking — drive the production state machine directly (headless
  //    Chrome has no GPS): active trip → position updates → auto-finish.
  const dest = { lat: 53.4808, lng: -2.2426 };
  Geo.activeTrip = {
    id: Utils.generateId('trip'),
    startTime: new Date().toISOString(),
    startLocation: '1 Test Street, Manchester',
    destinationAddress: '12 Test Road',
    destination: dest,
    appointmentId: v1.id,
    distanceKm: 0,
    path: [{ lat: 53.475, lng: -2.25 }],
    lastPos: { lat: 53.475, lng: -2.25 }
  };
  Geo.persistActiveTrip();

  const pos = (lat, lng) => ({ coords: { latitude: lat, longitude: lng, accuracy: 10 } });
  Geo.onTripPositionUpdate(pos(53.478, -2.246));  // mid-point (~0.5 km in)
  step('trip distance accumulates as we move', Geo.activeTrip && Geo.activeTrip.distanceKm > 0, { got: Geo.activeTrip && Geo.activeTrip.distanceKm });
  step('trip state persists between position updates', Geo.activeTrip && Geo.activeTrip.path.length === 2);

  Geo.onTripPositionUpdate(pos(dest.lat, dest.lng));  // arrival → auto-finish
  // finishTrip is async (road-distance lookup) — wait for it to complete.
  const deadline = Date.now() + 20000;
  while (Geo.activeTrip !== null && Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 250));
  }
  step('arrival auto-finishes the trip', Geo.activeTrip === null, { got: Geo.activeTrip && Geo.activeTrip.id });

  const trips = await DB.db.trips.toArray();
  const loggedTrip = trips.find(t => t.appointmentId === v1.id);
  step('finished trip is logged against the visit', !!loggedTrip && loggedTrip.autoTracked === true);
  step('logged trip has a real distance', loggedTrip && typeof loggedTrip.distanceKm === 'number' && loggedTrip.distanceKm > 0, { got: loggedTrip && loggedTrip.distanceKm });

  const arrived = await DB.db.appointments.get(v1.id);
  step('visit marked on_site on arrival', arrived.travelStatus === 'on_site', { got: arrived.travelStatus });

  document.body.textContent = JSON.stringify({ results });

  } catch (e) {
    document.body.textContent = "SEED_FAILED: " + (e && e.message ? e.message : String(e));
  }
});
</script>
