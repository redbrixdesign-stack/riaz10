<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14170f">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#14170f">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14170f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="AdvisorOS - The self-employed companion app for field service professionals">
  <style>html,body{background-color:#14170f;}</style>

  <title>AdvisorOS</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-72.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts loaded non-render-blocking: preload as a low-priority stylesheet,
       then swap it in once it arrives. Saves ~2 render-blocking requests off
       the critical path (was contributing to the 1,230ms "render-blocking
       requests" finding). The <noscript> fallback covers the no-JS case. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  </noscript>

  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/components.css?v=11">

  <script src="js/vendor/minidexie.min.js?v=9" defer></script>
</head>
<body>
  <div id="app">
    <main id="main"></main>
    <nav id="bottom-nav"></nav>
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="bottom-sheet" id="bottom-sheet" onclick="event.stopPropagation()"></div>
    </div>
    <div class="modal-full" id="modal-full"></div>
  </div>

  <!-- Core -->
  <script src="js/core/config.min.js?v=6" defer></script>
  <script src="js/core/utils.min.js?v=4" defer></script>
  <script src="js/core/db.min.js?v=9" defer></script>
  <script src="js/core/geo.min.js?v=4" defer></script>
  <script src="js/core/search.min.js?v=2" defer></script>
  <script src="js/core/tax.min.js?v=2" defer></script>
  <script src="js/core/app.min.js?v=4" defer></script>
  <script src="js/core/contact.min.js?v=3" defer></script>

  <!-- Services -->
  <script src="js/services/notification.min.js?v=4" defer></script>
  <script src="js/services/export.min.js?v=2" defer></script>
  <script src="js/services/weather.min.js?v=2" defer></script>

  <!-- Features -->
  <script src="js/features/onboarding/onboarding.min.js?v=3" defer></script>
  <script src="js/features/today/today.min.js?v=13" defer></script>
  <script src="js/features/today/home-screen-controller.min.js?v=3" defer></script>
  <script src="js/features/appointments/appointments.min.js?v=14" defer></script>
  <script src="js/features/route/route.min.js?v=5" defer></script>
  <script src="js/features/money/money.min.js?v=3" defer></script>
  <script src="js/features/talk/talk.min.js?v=4" defer></script>
  <script src="js/features/measure/measure.min.js?v=2" defer></script>
  <script src="js/features/ocr/ocr.min.js?v=8" defer></script>
  <script src="js/features/control/control.min.js?v=2" defer></script>
  <script src="js/features/settings/settings.min.js?v=6" defer></script>
</body>
</html>
