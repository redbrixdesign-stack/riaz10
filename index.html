  <!-- Content-Security-Policy is delivered as an HTTP response header by
       vercel.json. Keeping a second meta policy caused frame-ancestors to be
       ignored and produced a production console warning. The header allows:
       - No 'unsafe-inline' in script-src: every interactive element now uses
         the delegated data-action router (js/core/app.js setupEvents), so
         inline handlers are gone and injection via on* attributes is blocked.
       - 'wasm-unsafe-eval': Tesseract.js loads its OCR core as Emscripten WASM
         (https://cdn.jsdelivr.net/npm/tesseract.js-core/...), which needs this
         or CSP blocks the WebAssembly compile.
       - unpkg.com: Leaflet (js + css) and the Tesseract main script.
       - cdn.jsdelivr.net: Tesseract's default worker + core (importScripts).
       - All fonts (Hanken Grotesk, JetBrains Mono, Material Symbols) are
         self-hosted same-origin WOFF2s — no Google Fonts requests at all.
       - tile.openstreetmap.org: Leaflet raster tiles (a/b/c subdomains).
       - connect-src 'self' https: — the AI proxy URL is user-configurable in
         Settings and can be any origin, so https: is allowed broadly rather
         than pinning one host users would then have to edit by hand.
       - frame-ancestors is enforced by the response header. -->
<style>html,body{background-color:#0A0A0A;}</style>

<title>Beelo</title>

  <link rel="manifest" href="manifest.json?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-gold-180.png">

  <!-- All three font families are self-hosted same-origin WOFF2s (see the
       @font-face blocks in css/core.css), precached by the service worker so
       they render offline. Preloading them here lets the first paint use the
       real typefaces immediately instead of swapping in after a FOUT; no
       Google Fonts request ever fires. -->
  <link rel="preload" href="assets/fonts/hankengrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/core.css?v=34">
  <link rel="stylesheet" href="css/components.css?v=52">

  <!-- Storage engine: real Dexie first (indexed queries, transactions); the
       bundled mini-Dexie shim only registers if Dexie is unavailable. -->
  <script src="js/vendor/dexie.min.js?v=1" defer></script>
  <script src="js/vendor/minidexie.min.js?v=12" defer></script>
