<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0A0A0A">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Beelo - The self-employed companion app for field service professionals">
  <!-- Content-Security-Policy. Built from what the app actually loads:
       - 'unsafe-inline' in script-src: the app uses ~289 inline onclick/onchange/
         oninput attributes throughout js/ — removing them is a separate job.
       - 'wasm-unsafe-eval': Tesseract.js loads its OCR core as Emscripten WASM
         (https://cdn.jsdelivr.net/npm/tesseract.js-core/...), which needs this
         or CSP blocks the WebAssembly compile.
       - unpkg.com: Leaflet (js + css) and the Tesseract main script.
       - cdn.jsdelivr.net: Tesseract's default worker + core (importScripts).
       - fonts.googleapis.com / fonts.gstatic.com: Google Fonts (Hanken Grotesk,
         JetBrains Mono, Material Symbols).
       - tile.openstreetmap.org: Leaflet raster tiles (a/b/c subdomains).
       - connect-src 'self' https: — the AI proxy URL is user-configurable in
         Settings and can be any origin, so https: is allowed broadly rather
         than pinning one host users would then have to edit by hand.
       - frame-ancestors is NOT enforced by <meta> CSP (HTTP header only) — it
         is included for when this policy is ever moved to headers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<style>html,body{background-color:#0A0A0A;}</style>

<title>Beelo</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-72.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts loaded non-render-blocking: preload as a low-priority stylesheet,
       then swap it in once it arrives. Saves ~2 render-blocking requests off
       the critical path (was contributing to the 1,230ms "render-blocking
       requests" finding). The <noscript> fallback covers the no-JS case.
       The icon font (Material Symbols Rounded) is self-hosted — it must work
       offline, so it ships as a same-origin asset (see css/core.css) and is
       only preloaded here; no Google Fonts request for icons. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  </noscript>

  <link rel="stylesheet" href="css/core.css?v=22">
  <link rel="stylesheet" href="css/components.css?v=21">

  <!-- Storage engine: real Dexie first (indexed queries, transactions); the
       bundled mini-Dexie shim only registers if Dexie is unavailable. -->
  <script src="js/vendor/dexie.min.js?v=1" defer></script>
  <script src="js/vendor/minidexie.min.js?v=12" defer></script>
</head>
<body>
  <div id="app">
    <main id="main"></main>
    <nav id="bottom-nav"></nav>
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="bottom-sheet" id="bottom-sheet" onclick="event.stopPropagation()"></div>
    </div>
    <div class="modal-full" id="modal-full"></div>
  </div>

  <!-- Core -->
  <script src="js/core/config.min.js?v=10" defer></script>
  <script src="js/core/utils.min.js?v=6" defer></script>
  <script src="js/core/db.min.js?v=15" defer></script>
  <script src="js/core/geoprovider.min.js?v=1" defer></script>
  <script src="js/core/geo.min.js?v=6" defer></script>
  <script src="js/core/search.min.js?v=2" defer></script>
  <script src="js/core/tax.min.js?v=2" defer></script>
  <script src="js/core/app.min.js?v=8" defer></script>
  <script src="js/core/contact.min.js?v=3" defer></script>

  <!-- Services -->
  <script src="js/services/ai.min.js?v=7" defer></script>
  <script src="js/services/notification.min.js?v=5" defer></script>
  <script src="js/services/message-scheduler.min.js?v=3" defer></script>
  <script src="js/services/export.min.js?v=3" defer></script>
  <script src="js/services/weather.min.js?v=3" defer></script>

  <!-- Features -->
  <script src="js/features/onboarding/onboarding.min.js?v=6" defer></script>
  <script src="js/features/companion/companion.min.js?v=3" defer></script>
  <script src="js/features/today/today.min.js?v=17" defer></script>
  <script src="js/features/today/home-screen-controller.min.js?v=10" defer></script>
  <script src="js/features/appointments/appointments.min.js?v=23" defer></script>
  <script src="js/features/customer/customer.min.js?v=3" defer></script>
  <script src="js/features/route/route.min.js?v=9" defer></script>
  <!-- Follow-ups and Orders load before Money so the bottom-nav order is
       Home, Follow-ups, Orders, Money, Tools (nav order = registration order). -->
  <script src="js/features/followups/followups.min.js?v=5" defer></script>
  <script src="js/features/orders/orders.min.js?v=5" defer></script>
  <script src="js/features/money/money.min.js?v=7" defer></script>
  <script src="js/features/talk/talk.min.js?v=14" defer></script>
  <script src="js/features/measure/measure.min.js?v=6" defer></script>
  <script src="js/features/ocr/ocr.min.js?v=17" defer></script>
  <script src="js/features/control/control.min.js?v=5" defer></script>
  <script src="js/features/settings/settings.min.js?v=11" defer></script>
</body>
</html>
